// Readiness for Android: the home-screen widget, plus a small set-up screen.
// No libraries: only the Android framework, so the build stays small and quick.
plugins { id 'com.android.application' }

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'io.github.fulviot20.readiness'
    compileSdk 35
    defaultConfig {
        applicationId 'io.github.fulviot20.readiness.widget'
        minSdk 26
        targetSdk 35
        versionCode runNumber
        versionName "1.${runNumber}"
    }
    signingConfigs {
        release {
            // the same key at every build (kept encrypted in the repository), so an update installs over the old one
            storeFile file(System.getenv('KS_FILE') ?: 'none.jks')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias 'readiness'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false; abortOnError false }
}
