name: Garmin probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # prints only the structure of the data and day counts, never personal values
      - name: Read Garmin data
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: python garmin.py || true; python probe2.py
