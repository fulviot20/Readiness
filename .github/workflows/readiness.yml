name: Readiness

on:
  schedule:
    # backup only: the Keeper workflow triggers this every 10 minutes
    - cron: "*/30 * * * *"
  push:
    paths:
      - "answers/**"
      - "notes/**"
      - "push/**"
      - "site/**"
      - "*.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: readiness
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # the latest result of the automated checks: a failure becomes a phone notification (push.py)
      - name: Stato dei controlli
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s=$(gh run list -R "${{ github.repository }}" --workflow Tests -L 1 --json status,conclusion,headSha -q '.[0] | "\(.status) \(.conclusion) \(.headSha)"' 2>/dev/null || true)
          echo "TESTS_STATE=$s" >> "$GITHUB_ENV"

      - name: Calcola gli score
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          READINESS_PASSPHRASE: ${{ secrets.READINESS_PASSPHRASE }}
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          pip install --quiet cryptography pywebpush
          python readiness.py

      - uses: actions/configure-pages@v5
        id: pages
      # GitHub Pages deploys sometimes fail on GitHub's side: then the notification has gone out but the app
      # still sees the old data. So we also publish whenever the live site doesn't hold the latest data,
      # and the next run (10 minutes later) repairs a failed deploy by itself.
      # only fingerprints and the encrypted cache are committed (no readable personal data)
      - name: Registra l'aggiornamento
        id: rec
        run: |
          git add -N data.hash cache/ 2>/dev/null || true
          live=$(curl -fsS -m 20 "${{ steps.pages.outputs.base_url }}/deployed.txt?t=$(date +%s)" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "push" ] || ! git diff --quiet -- data.hash || [ "$live" != "$(cat data.hash)" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --quiet -- data.hash cache/; then
            git config user.name "readiness-bot"
            git config user.email "readiness-bot@users.noreply.github.com"
            git add data.hash cache/
            git commit -m "Aggiornamento score"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
          fi

      - uses: actions/upload-pages-artifact@v3
        if: steps.rec.outputs.deploy == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deploy
        if: steps.rec.outputs.deploy == 'true'
        continue-on-error: true
      - name: Riprova il deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - uses: actions/deploy-pages@v4
        if: steps.deploy.outcome == 'failure'
