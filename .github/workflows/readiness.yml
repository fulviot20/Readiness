name: Readiness

on:
  schedule:
    # backup only: the Keeper workflow triggers this every 10 minutes
    - cron: "*/30 * * * *"
  push:
    paths:
      - "answers/**"
      - "notes/**"
      - "push/**"
      - "site/**"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: readiness
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calcola gli score
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          READINESS_PASSPHRASE: ${{ secrets.READINESS_PASSPHRASE }}
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: |
          pip install --quiet cryptography pywebpush
          python readiness.py

      # only fingerprints and the encrypted cache are committed (no readable personal data)
      - name: Registra l'aggiornamento
        id: rec
        run: |
          git add -N data.hash cache/ 2>/dev/null || true
          if [ "${{ github.event_name }}" = "push" ] || ! git diff --quiet -- data.hash; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --quiet -- data.hash cache/; then
            git config user.name "readiness-bot"
            git config user.email "readiness-bot@users.noreply.github.com"
            git add data.hash cache/
            git commit -m "Aggiornamento score"
            for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
          fi

      - uses: actions/configure-pages@v5
        if: steps.rec.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.rec.outputs.deploy == 'true'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: steps.rec.outputs.deploy == 'true'
