<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Readiness">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Readiness</title>
<style>
:root{
  --bg:#121a26;--surface:#1a2433;--surface2:#212d3f;--line:#2a3749;
  --text:#eceff4;--muted:#8c98ab;--faint:#5f6c80;
  --rose:#e2687a;--hr:#f07a8c;--pw:#b07cf0;--b1:#a45bd9;--b2:#6b6cf2;--b3:#3a9cf5;--b4:#2cc9c0;--b5:#5fe08a;--amber:#e9a15a;--s1:#ff5d6c;--s2:#f7c948;--s3:#34d399;--s4:#4aa3ff;--sand:#d9c46a;--alpine:#5fc795;--glacier:#6fd3e6;
  --z1:#7d8798;--z2:#3e8ede;--z3:#3fb97a;--z4:#e5c33f;--z5:#ee8a3a;--z6:#e04f5f;--z7:#9b6ce0;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --ui:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--ui)}
body{padding:env(safe-area-inset-top) 18px calc(96px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% -10%,#1d2a3d 0%,var(--bg) 60%) fixed}
main{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glacier);outline-offset:2px;border-radius:8px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.daypick{display:flex;align-items:center;gap:2px}
.daypick .d{font-family:var(--cond);font-size:24px;font-weight:500;letter-spacing:.01em;padding:0 4px}
.chev{background:none;border:0;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);cursor:pointer;border-radius:10px}
.chev:disabled{opacity:.25;cursor:default}
.chev svg,.gear svg{width:20px;height:20px}
.gear{background:none;border:0;color:var(--muted);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:12px}

/* gauge */
.g-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px auto 0;max-width:360px}
.gauge{position:relative;display:block;flex:0 1 230px;min-width:0;background:none;border:0;padding:0;cursor:pointer}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.g-num{font-family:var(--cond);font-weight:300;font-size:74px;letter-spacing:-.025em;fill:var(--text)}
.g-band{font-family:var(--ui);font-weight:600;font-size:11.5px;letter-spacing:.16em}
.g-of{font-family:var(--ui);font-size:10.5px;letter-spacing:.14em;fill:var(--faint)}
.g-legend{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:none}
.g-legend li{display:grid;grid-template-columns:6px auto;column-gap:7px;align-items:center;opacity:.42;transition:opacity .3s}
.g-legend li.on{opacity:1}
.g-legend i{width:6px;height:6px;border-radius:50%;grid-row:span 2}
.g-legend b{font:600 9.5px/1.1 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--text)}
.g-legend span{font:400 9px/1.2 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.mini{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:18px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--text);min-width:0}
.mini svg{flex:none;width:52px;height:52px}
.mini .mn{font-family:var(--cond);font-size:19px;font-weight:500;fill:var(--text)}
.mini .mt{min-width:0}
.mini .mt small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.mini .mt b{display:block;font-size:15px;font-weight:600;margin-top:1px}
.mini .mt span{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off{display:block;margin:16px auto 0;background:none;border:0;color:var(--faint);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.picks{display:grid;gap:8px;margin:14px 0}
.picks button{background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:13px 14px;text-align:left;color:var(--text);cursor:pointer;font-size:15px}
.picks button.on{border-color:var(--glacier);background:rgba(111,211,230,.08)}
.field textarea{width:100%;min-height:84px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;resize:vertical}
.bars30 svg{display:block;width:100%;height:auto}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px;margin:6px 0 16px}
.kv span{color:var(--muted)}.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.vrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.vrow span{color:var(--muted)}
.vnote{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.vnote em{font-style:normal;color:var(--faint);font-size:12.5px}
.adj{text-align:center;font-size:13px;color:var(--muted);min-height:18px;margin-top:6px}
.verdict{text-align:center;font-size:18px;font-weight:500;margin:10px 0 4px;text-wrap:balance;color:var(--text)}
.why{text-align:center;font-size:14.5px;color:var(--muted);margin:0 16px;text-wrap:balance}
.pending{background:var(--surface);border-radius:18px;padding:16px;margin-top:14px;text-align:center}
.pending p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.pending .st{margin:10px 0 0;font-size:13.5px}
.notice{font-size:14px;color:var(--muted);text-align:center;margin:12px 0 0}

/* sections */
.sec{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.sec-h h2{font-family:var(--cond);font-size:22px;font-weight:500;margin:0;letter-spacing:.01em}
.sec-h span{font-size:13px;color:var(--faint)}

/* signals */
.signals{border-top:1px solid var(--line)}
.sig{display:grid;grid-template-columns:1fr 92px 86px;align-items:center;gap:10px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;text-align:left;cursor:pointer}
.sig .n{font-weight:600;font-size:16px}
.sig .s{font-size:13.5px;color:var(--muted);margin-top:1px}
.sig .s i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sig svg{width:92px;height:34px;display:block}
.sig .v{font-family:var(--cond);font-size:30px;font-weight:400;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.sig .v small{font-size:14px;color:var(--muted);margin-left:2px}

/* sessions */
.wcard{display:block;background:var(--surface);border-radius:18px;padding:16px;margin-bottom:10px;color:var(--text);text-decoration:none}
.wcard:active{background:var(--surface2)}
.w-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2);padding:4px 10px;border-radius:99px}
.tag.done{color:#0e2b22;background:var(--b5)}
.go{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none}
.w-name{font-family:var(--cond);font-size:26px;font-weight:500;line-height:1.1}
.w-meta{font-size:14px;color:var(--muted);margin-top:4px}
.prof{width:100%;height:78px;display:block;margin-top:14px;border-radius:6px}
.prof-lg{display:flex;gap:14px;font-size:12.5px;color:var(--faint);margin-top:6px}
.prof-lg i{display:inline-block;vertical-align:2px;margin-right:6px}
.prof-lg i.sw{width:14px;height:8px;border-radius:2px}
.prof-lg i.ln{width:14px;height:0;border-top:2px solid var(--hr)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mgrid span{display:block;font-size:12.5px;color:var(--muted)}
.mgrid b{font-family:var(--cond);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.mgrid b small{font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
.w-foot{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.w-foot{align-items:center}
.w-foot b{color:var(--text);font-weight:600}
.feel{display:inline-flex;align-items:center;gap:8px}
.wcard.rest .w-name{font-size:21px}
.callink{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;color:var(--text);text-decoration:none}
.callink:active{background:var(--surface)}
.cal-ic{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--b3);flex:none}
.cal-t{flex:1}
.cal-t b{display:block;font-weight:600}
.cal-t span{font-size:13.5px;color:var(--muted)}
.feelpip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--text);font-size:13px;margin-left:6px}

/* check-in */
.checkin{background:var(--surface);border-radius:18px;padding:18px 16px}
.checkin .lead{font-size:14px;color:var(--muted);margin:0 0 18px}
.qq{margin-bottom:22px}
.qq h3{font-size:16px;font-weight:600;margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{background:var(--surface2);border:1px solid transparent;border-radius:12px;height:46px;cursor:pointer;
  font-family:var(--cond);font-size:22px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.seg.two button{font-family:var(--ui);font-size:15px;font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
.anchor{min-height:42px;margin-top:9px;font-size:14px;color:var(--muted)}
.anchor b{color:var(--text);font-weight:600}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.savebar .st{font-size:13.5px;color:var(--muted)}
.btn{background:var(--glacier);color:#0c2a31;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.quiet{background:var(--surface2);color:var(--text)}

/* trend */
.trend{background:var(--surface);border-radius:18px;padding:16px 14px 10px}
.trend svg{width:100%;height:118px;display:block}
.trend .ax{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:6px}

.card{background:var(--surface);border-radius:18px;padding:16px}
.wk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wk-stat span{display:block;font-size:12.5px;color:var(--muted)}
.wk-stat b{font-family:var(--cond);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.wk-stat b small{font-size:15px;color:var(--faint);font-weight:400;margin-left:4px}
.wk-bar{height:4px;border-radius:99px;background:var(--surface2);margin-top:6px;overflow:hidden}
.wk-bar i{display:block;height:100%;background:var(--b3);border-radius:99px}
.wk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:20px}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 6px;border-radius:12px}
.wk-day.today{background:var(--surface2)}
.wk-day span{font-size:12px;color:var(--muted);font-weight:600}
.wk-day i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.wk-day.done i{background:var(--b5);border-color:var(--b5)}
.wk-day.plan i{border-color:var(--b3)}
.wk-day.missed i{border-color:var(--amber);border-style:dashed}
.wk-day em{font-style:normal;font-family:var(--cond);font-size:14px;color:var(--muted)}
.wk-day.done em{color:var(--text)}
.wk-key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-top:10px}
.wk-key .r{margin-left:auto}
.wk-key i.k{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid;margin-right:5px;vertical-align:-1px}
.wk-key i.done{background:var(--b5);border-color:var(--b5)}.wk-key i.plan{border-color:var(--b3)}.wk-key i.missed{border-color:var(--amber);border-style:dashed}
.wk-hist-h{font-size:12.5px;color:var(--muted);margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.wk-hist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:84px}
.wk-h{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.wk-h i{display:block;width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--surface2)}
.wk-h.cur i{background:var(--b3)}
.wk-h span{font-size:11px;color:var(--faint)}
.fit-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fit-top span{display:block;font-size:12.5px;color:var(--muted)}
.fit-top span i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.fit-top b{font-family:var(--cond);font-size:28px;font-weight:500}
.fit-day{font-size:13px;color:var(--faint);margin:4px 0 8px}
.fit-svg{width:100%;height:auto;display:block}
.fit .ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:6px;gap:8px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;gap:8px;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(18,26,38,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar button{flex:0 1 160px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);cursor:pointer;font-size:12px;font-weight:600}
.tabbar button.on{color:var(--text)}
.ttl{font-family:var(--cond);font-size:30px;font-weight:500}
.streak{margin-top:10px}
.streak .muted-s{margin:10px 0 14px}
.st-weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.st-weeks i{height:10px;border-radius:3px;background:var(--surface2)}
.st-weeks i.on{background:linear-gradient(90deg,#ffb35c,#f0607a)}
.st-weeks i.cur{outline:1.5px solid var(--muted);outline-offset:2px}
.st-ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:8px}
.muted-s{font-size:13.5px;color:var(--muted);margin:0}
.wk-sp,.vol-sp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sp-row{display:grid;grid-template-columns:10px 72px 1fr 66px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.sp-row i{width:9px;height:9px;border-radius:50%}
.sp-row em{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden}
.sp-row em u{display:block;height:100%;border-radius:99px}
.sp-row b{font-family:var(--cond);font-size:17px;font-weight:500;text-align:right}
.vol .range{margin-bottom:14px}
.vol-read{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vol-read span{font-size:14px;color:var(--muted)}
.vol-read b{font-family:var(--cond);font-size:28px;font-weight:500}
.vol-read em{font-style:normal;font-size:13px;color:var(--faint)}
.vbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;height:130px}
.vbars.few{grid-auto-columns:minmax(0,56px);justify-content:center;gap:18px}
.vb{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;cursor:pointer;min-width:0}
.vb-col{flex:1;display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;opacity:.62;transition:opacity .15s}
.vb.on .vb-col{opacity:1}
.vb-col u{display:block;width:100%}
.vb-col u.nil{height:2px;background:var(--line)}
.vb em{font-style:normal;font-size:11px;color:var(--faint);text-align:center}
.vb.on em{color:var(--text)}
.verdict-b{display:block;width:100%;background:none;border:0;padding:6px 10px;cursor:pointer;text-align:center}
.verdict-b .verdict,.verdict-b .why{display:block}
.verdict-b .more{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--b3)}
.verdict-b .more::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg)}
.guide{margin:0 0 18px;padding:0;list-style:none}
.guide li{position:relative;padding:10px 0 10px 22px;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.guide li::before{content:"";position:absolute;left:4px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--b3)}
.note-card{background:var(--surface2);border-radius:14px;padding:14px 16px;font-size:14.5px;color:var(--muted);line-height:1.5}
.note-card b{color:var(--text)}
.sp-cap{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.st-top{display:flex;align-items:center;gap:14px}
.st-n{display:flex;align-items:baseline;gap:6px}
.st-n b{font-family:var(--cond);font-size:44px;font-weight:500;line-height:1}
.st-n span{font-size:16px;color:var(--muted)}
.st-l{font-size:13.5px;color:var(--faint);margin-top:2px}
.st-quote{font-size:16px;line-height:1.45;margin:14px 0 16px;color:var(--text);font-weight:500}
.tonight{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,#1c2540,#1d2a3d);border:1px solid #2b3858;border-radius:18px;padding:14px 16px;margin-top:14px;cursor:pointer;color:var(--text)}
.tn-ic{width:40px;height:40px;border-radius:12px;background:rgba(107,108,242,.18);color:#a9aaff;display:grid;place-items:center;flex:none}
.tn-t b{display:block;font-weight:600;font-size:15.5px}
.tn-t span{font-size:13.5px;color:var(--muted)}
.note-card.sl{margin:12px 0 4px}
.foot{text-align:center;font-size:12.5px;color:var(--faint);margin-top:26px;line-height:1.6}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,9,15,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:11;max-width:560px;margin:0 auto}
.sheet:not(.open){visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start}
.sh-top h2{font-family:var(--cond);font-size:28px;font-weight:500;margin:0}
.sh-top .x{background:var(--surface2);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.sh-big{font-family:var(--cond);font-size:56px;font-weight:300;line-height:1;margin:10px 0 2px}
.sh-big small{font-size:20px;color:var(--muted);margin-left:8px;font-weight:400}
.sh-desc{color:var(--muted);font-size:14.5px;margin:8px 0 16px}
.range{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:12px}
.range button{background:none;border:0;padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
.range button.on{background:var(--bg);color:var(--text)}
.sh-chart svg{width:100%;height:auto;display:block;overflow:visible}
.sh-chart .ax{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:4px}
.readout{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:30px;margin-bottom:4px}
.readout span{font-size:14px;color:var(--muted)}
.readout b{font-family:var(--cond);font-size:24px;font-weight:500}
.readout em{font-style:normal;font-size:14px}
.sh-chart .rl{font-family:var(--cond);font-size:13px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid;margin-right:6px;vertical-align:0}
.legend i.ln{width:16px;height:0;border-radius:0;border:0;border-top:2px solid var(--glacier);opacity:.7;vertical-align:3px}
.sh-chart .lg{font-size:12.5px;color:var(--faint);margin-top:8px}
.sh-h3{font-family:var(--cond);font-size:21px;font-weight:500;margin:28px 0 4px}
.sh-note{font-size:14px;color:var(--muted);margin:0 0 14px}
.sh-note.warn{color:var(--amber)}
.bd{margin-bottom:14px}
.bd-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bd-t span{font-weight:600}
.bd-t i{font-style:normal;font-weight:400;color:var(--faint);font-size:13px;margin-left:8px}
.bd-t b{font-family:var(--cond);font-size:22px;font-weight:500}
.bd-bar{position:relative;height:6px;border-radius:99px;background:var(--surface2)}
.bd-bar span{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bd-bar em{position:absolute;top:-3px;width:2px;height:12px;background:var(--muted);border-radius:1px}
.bd-adj{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.bd-adj b{font-family:var(--cond);font-size:22px;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:20px}
.stats div span{display:block;font-size:13px;color:var(--muted)}
.stats div b{font-family:var(--cond);font-size:24px;font-weight:500}
.field{margin-top:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font:inherit}
.field p{font-size:13px;color:var(--faint);margin:6px 0 0}

/* lock screen */
.lock{max-width:400px;margin:16vh auto 0}
.lock h1{font-family:var(--cond);font-weight:300;font-size:52px;margin:0}
.lock p{color:var(--muted);margin:4px 0 24px}
.lock .btn{width:100%;margin-top:22px;padding:14px}
.err{color:var(--rose);font-size:14px;margin-top:12px;min-height:20px}
.splash{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:spin-in .9s cubic-bezier(.2,.8,.2,1) both}
.sp-w{font-family:var(--cond);font-weight:300;font-size:34px;letter-spacing:.02em}
@keyframes spin-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.loading{margin-top:42vh;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside>

<script>
"use strict";
/* ------------------------------------------------------------ storage */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clip=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ------------------------------------------------------------ vocabulary */
const BANDS=[[80,"Super","var(--s4)"],[60,"Normal","var(--s3)"],[50,"Low","var(--s2)"],[0,"Very low","var(--s1)"]];
const ADVICE={"Super":"Recovery is above your usual: a good day to go for it if you feel it.",
  "Normal":"Recovery is in your usual range: train as planned and stay tuned to how it feels.",
  "Low":"Recovery is below your usual: see how the legs respond.",
  "Very low":"Recovery is well below your usual: keep an eye on how you feel today."};
const bandOf=s=>BANDS.find(b=>s>=b[0]);
const FEEL={1:"Strong",2:"Good",3:"Normal",4:"Poor",5:"Weak"};
const Q={
  sleep:{title:"How rested did you wake up?",
    hint:"Judge how you felt getting out of bed, not how the night went. Your watch already tracks the night.",
    opts:[["Exhausted","drained, could barely get up."],["Tired","felt like you needed a lot more sleep."],
      ["So-so","groggy at first, fine once moving."],["Rested","woke up fresh, even after a broken night."],
      ["Recharged","woke easily, full of energy."]]},
  feel:{title:"How recovered does your body feel?",
    hint:"Think legs and energy as if you had to train right now.",
    opts:[["Wrecked","heavy, sore legs; a session would be a struggle."],["Fatigued","legs still carry the last sessions."],
      ["Normal","neither fresh nor tired."],["Fresh","light legs, ready for a solid session."],
      ["Primed","you could go hard right now."]]},
};

/* ------------------------------------------------------------ crypto */
const b64={dec:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),enc:u=>btoa(String.fromCharCode(...u))};
async function keyFor(pass,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function decryptEnv(env,pass){
  const key=await keyFor(pass,b64.dec(env.salt));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64.dec(env.iv)},key,b64.dec(env.ct))));
}
async function encryptObj(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFor(pass,salt),new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1,salt:b64.enc(salt),iv:b64.enc(iv),ct:b64.enc(ct)};
}

/* ------------------------------------------------------------ score adjust (mirrors readiness.py) */
function applyAnswers(day,ans){
  if(day.score==null) return day;
  let mod=0,sick=false;
  if(ans){ if(ans.feel) mod+=(ans.feel-3)*5; if(ans.sleep) mod+=(ans.sleep-3)*2.5; if(ans.sick){sick=true;mod-=10;} }
  mod=clip(mod,-15,15);
  let s=clip(day.base+mod,1,100); if(sick||day.alarm) s=Math.min(s,49); s=Math.round(s);
  const band=bandOf(s)[1];
  return {...day,score:s,mod:Math.round(mod),band,advice:ADVICE[band],answers:ans||null};
}

/* ------------------------------------------------------------ state */
let DATA=null,sel=0,draft={},prevScore=0;
const todayISO=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Rome"});
const fmtDay=(iso,o)=>new Date(iso+"T12:00").toLocaleDateString("en-GB",o);
const hm=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`};
const sameAns=(a,b)=>JSON.stringify(a||{},Object.keys(a||{}).sort())===JSON.stringify(b||{},Object.keys(b||{}).sort());

async function load(){
  const pass=LS.get("rd_pass"); if(!pass) return lock();
  $("app").innerHTML=splash();
  try{
    const r=await fetch("data.enc?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("No data published yet. Run the workflow on GitHub.");
    DATA=await decryptEnv(await r.json(),pass);
  }catch(e){
    if(e.name==="OperationError") return lock("That passphrase doesn't match. Try again.");
    $("app").innerHTML=`<p class="loading">${esc(e.message)}</p>`; return;
  }
  for(const d of DATA.days){const n=LS.get("note:"+d.date); if(n&&!d.note) d.note=JSON.parse(n);}
  for(const d of DATA.days){const l=LS.get("ans:"+d.date); if(l&&!d.answers) Object.assign(d,applyAnswers(d,JSON.parse(l)));}
  // always open on today, even before today's data has arrived
  const today=todayISO();
  if(!DATA.days.some(d=>d.date===today)){
    const loc=LS.get("ans:"+today);
    DATA.days.push({date:today,workouts:[],plan:(DATA.upcoming||{})[today]||[],answers:loc?JSON.parse(loc):null});
  }
  sel=DATA.days.findIndex(d=>d.date===today);
  draft={...(DATA.days[sel].answers||{})};
  loadedAt=Date.now(); prevScore=0; render();
  autoRefresh();
}
let loadedAt=0,polling=false,autoTries=0;
// GitHub's schedule is unreliable (runs can be skipped for hours): every time the app opens
// with stale data, it asks GitHub to recalculate and waits for the new score by itself
async function autoRefresh(){
  const latest=DATA.days[DATA.days.length-1],age=Date.now()-new Date(DATA.generated_at).getTime();
  const stale=latest.date!==todayISO()||latest.score==null||age>20*60000;
  const token=LS.get("rd_token");
  if(!stale||!token||polling||autoTries>=2) return;
  autoTries++;
  const last=+(LS.get("rd_dispatch")||0);
  if(Date.now()-last>3*60000){
    try{
      const owner=location.hostname.split(".")[0],repo=location.pathname.split("/").filter(Boolean)[0];
      const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/readiness.yml/dispatches`,
        {method:"POST",headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({ref:"main"})});
      if(!r.ok) return;
      LS.set("rd_dispatch",String(Date.now()));
    }catch(e){ return; }
  }
  polling=true; setNote("Updating…");
  const was=DATA.generated_at,pass=LS.get("rd_pass"),t0=Date.now();
  while(Date.now()-t0<4*60000){
    await new Promise(r=>setTimeout(r,15000));
    try{
      const r=await fetch("data.enc?t="+Date.now(),{cache:"no-store"}); if(!r.ok) continue;
      const d=await decryptEnv(await r.json(),pass);
      if(d.generated_at!==was){ polling=false; return load(); }
    }catch(e){}
  }
  polling=false; setNote("");
}
function setNote(t){ const n=$("upd-note"); if(n) n.textContent=t; const b=$("upd"); if(b) b.disabled=!!t; }
// the installed app stays in memory overnight: refresh the data when it comes back to the screen
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&DATA&&!$("sheet").classList.contains("open")){ autoTries=0; if(Date.now()-loadedAt>60000) load(); else autoRefresh(); }
});
async function requestUpdate(btn){
  if(!LS.get("rd_token")){ $("upd-note").textContent="Add a GitHub token in settings to update from here."; return; }
  LS.del("rd_dispatch"); autoTries=0; polling=false; autoRefresh();
}

const LOGO_SEGS=[["#ff5d6c",0,50],["#f7c948",74,124],["#34d399",148,212],["#4aa3ff",236,300]];
function logoSVG(sz){
  const P=a=>[50+36*Math.sin(a*Math.PI/180),50-36*Math.cos(a*Math.PI/180)];
  const arc=(a,b)=>{const[x1,y1]=P(a),[x2,y2]=P(b);return `M${x1.toFixed(2)} ${y1.toFixed(2)}A36 36 0 ${b-a>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;};
  const[hx,hy]=P(300);
  return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}" aria-hidden="true">
    <circle cx="50" cy="50" r="36" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="9"/>
    ${LOGO_SEGS.map(([col,a,b])=>`<path d="${arc(a,b)}" stroke="${col}" stroke-width="9" stroke-linecap="round" fill="none"/>`).join("")}
    <circle cx="${hx.toFixed(2)}" cy="${hy.toFixed(2)}" r="2.6" fill="#fff"/></svg>`;
}
function splash(){return `<div class="splash">${logoSVG(96)}<div class="sp-w">Readiness</div></div>`;}
function lock(msg){
  const tb=$("tabbar"); if(tb) tb.remove();
  $("app").innerHTML=`<div class="lock">${logoSVG(64)}<h1>Readiness</h1><p>Enter the passphrase you saved on GitHub. It stays on this device.</p>
    <div class="field"><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn" id="go">Unlock</button><div class="err">${esc(msg||"")}</div></div>`;
  const go=()=>{const v=$("pw").value.trim(); if(v){LS.set("rd_pass",v);load();}};
  $("go").onclick=go; $("pw").onkeydown=e=>{if(e.key==="Enter")go()};
}

/* ------------------------------------------------------------ gauge */
const SEGS=[[0,50,"var(--s1)","Very low"],[50,60,"var(--s2)","Low"],[60,80,"var(--s3)","Normal"],[80,100,"var(--s4)","Super"]];
const segColor=v=>SEGS.find(s=>v<s[1]||s[1]===100)[2];
const RING={c:120,r:98,w:12};RING.C=2*Math.PI*RING.r;
const HUE={"var(--s1)":["#ff8a95","#ff4d5e"],"var(--s2)":["#ffe08a","#f2b632"],"var(--s3)":["#7ef0c0","#1fbf86"],"var(--s4)":["#8cc8ff","#3b82f6"],"var(--faint)":["#5f6c80","#5f6c80"]};
function ringDash(v){const L=RING.C*clip(v,0,100)/100;return `${L.toFixed(2)} ${RING.C.toFixed(2)}`;}
function ringHead(v){const a=(-90+360*clip(v,0,100)/100)*Math.PI/180;return [RING.c+RING.r*Math.cos(a),RING.c+RING.r*Math.sin(a)];}
function gaugeSVG(score,band,color){
  const {c,r,w}=RING,[h1,h2]=HUE[color]||HUE["var(--faint)"],v=score??0,[hx,hy]=ringHead(v);
  const notches=[50,60,80].map(t=>{const a=(-90+3.6*t)*Math.PI/180,p=k=>[c+k*Math.cos(a),c+k*Math.sin(a)],[x1,y1]=p(r-w/2-1),[x2,y2]=p(r+w/2+1);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="var(--bg)" stroke-width="2.2"/>`;}).join("");
  return `<svg viewBox="0 0 240 240" aria-label="Readiness ${score??"pending"} of 100, ${esc(band)}">
    <defs>
      <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${h1}"/><stop offset="1" stop-color="${h2}"/></linearGradient>
      <radialGradient id="rin" cx="50%" cy="38%" r="62%"><stop offset="0" stop-color="#ffffff" stop-opacity=".055"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></radialGradient>
      <filter id="rglow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>
    <circle cx="${c}" cy="${c}" r="${r-w/2-4}" fill="url(#rin)"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="${w}"/>
    ${notches}
    <g transform="rotate(-90 ${c} ${c})" style="opacity:${score==null?0:1}">
      <circle class="r-arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${h2}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${ringDash(v)}" filter="url(#rglow)" opacity=".5"/>
      <circle class="r-arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${ringDash(v)}"/>
    </g>
    <circle id="r-head" cx="${hx.toFixed(2)}" cy="${hy.toFixed(2)}" r="3.4" fill="#fff" opacity="${score==null?0:.95}"/>
    <text class="g-num" id="g-num" x="${c}" y="${c+14}" text-anchor="middle">${score??"–"}</text>
    <text class="g-band" x="${c}" y="${c+40}" text-anchor="middle" fill="${h1}">${esc(band.toUpperCase())}</text>
  </svg>`;
}
function legendHTML(band){
  const rng={"Super":"80–100","Normal":"60–79","Low":"50–59","Very low":"0–49"};
  return `<ul class="g-legend" aria-label="Score bands">${[...SEGS].reverse().map(([,,col,name])=>
    `<li class="${name===band?"on":""}"><i style="background:${col};box-shadow:0 0 6px ${col}"></i><b>${name}</b><span>${rng[name]}</span></li>`).join("")}</ul>`;
}
function animateGauge(from,to){
  const num=$("g-num"),arcs=[...document.querySelectorAll(".gauge .r-arc")],head=$("r-head");
  if(!num) return;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,T=reduce?0:1200,t0=performance.now();
  const step=now=>{const k=T?clip((now-t0)/T,0,1):1,e=1-Math.pow(1-k,3),v=from+(to-from)*e,d=ringDash(v),[hx,hy]=ringHead(v);
    arcs.forEach(a=>a.setAttribute("stroke-dasharray",d)); head.setAttribute("cx",hx.toFixed(2)); head.setAttribute("cy",hy.toFixed(2));
    num.textContent=Math.round(v); if(k<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

/* ------------------------------------------------------------ sleep & strain */
const SLEEP_C="#a78bfa",STRAIN_C="#22d3ee";
function miniRing(v,col){
  const r=21,C=2*Math.PI*r,L=C*clip(v??0,0,100)/100;
  return `<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width="5"/>
    ${v?`<circle cx="26" cy="26" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${L.toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 26 26)"/>`:""}
    <text class="mn" x="26" y="32.5" text-anchor="middle">${v??"–"}</text></svg>`;
}
function duo(raw,isToday){
  const sl=raw.sleep_score,sk=raw.strain,i=DATA.days.indexOf(raw),y=i>0?DATA.days[i-1].strain:null;
  const skSub=sk&&sk.score?`Load ${sk.load}`:(isToday&&y&&y.score?`Yesterday ${y.score}`:"No training");
  return `<div class="duo">
    <button class="mini" id="m-sleep">${miniRing(sl?sl.score:null,SLEEP_C)}<span class="mt"><small>SLEEP</small><b>${sl?esc(sl.band):"–"}</b><span>${sl?hmh(sl.hours):"No data"}</span></span></button>
    <button class="mini" id="m-strain">${miniRing(sk?sk.score:null,STRAIN_C)}<span class="mt"><small>STRAIN</small><b>${sk?esc(sk.band):"–"}</b><span>${esc(skSub)}</span></span></button></div>`;
}
function bars30(key,col){
  const days=DATA.days.slice(Math.max(0,sel-29),sel+1),W=320,H=110,bw=W/days.length;
  const bars=days.map((d,i)=>{const v=d[key]?.score,h=v?Math.max(3,v/100*H):2;
    return `<rect x="${(i*bw+1.2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-2.4).toFixed(1)}" height="${h.toFixed(1)}" rx="2" fill="${v?col:"var(--line)"}" opacity="${i===days.length-1?1:.5}"/>`;}).join("");
  return `<div class="sh-chart bars30"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bars}</svg>
    <div class="ax"><span>${fmtDay(days[0].date,{day:"numeric",month:"short"})}</span><span>${fmtDay(days[days.length-1].date,{day:"numeric",month:"short"})}</span></div></div>`;
}
function openSleepScore(){
  const s=DATA.days[sel].sleep_score; if(!s) return;
  openSheet(`<div class="sh-top"><h2>Sleep</h2>${X}</div>
    <div class="sh-big" style="color:${SLEEP_C}">${s.score}<small>${esc(s.band)}</small></div>
    <p class="sh-desc">How well last night covered your own need, learned from your last 30 nights. Short nights in a row add a debt that lowers it.</p>
    <div class="kv"><span>Last night</span><b>${hmh(s.hours)}</b><span>Your usual need</span><b>${hmh(s.need)}</b>
      <span>Debt over 3 nights</span><b>${s.debt>=.1?hmh(s.debt):"None"}</b>${s.garmin?`<span>Garmin sleep score</span><b>${s.garmin}</b>`:""}</div>
    <div class="sec-h"><h2>Last 30 days</h2></div>${bars30("sleep_score",SLEEP_C)}`);
}
function openStrain(){
  const raw=DATA.days[sel],s=raw.strain; if(!s) return;
  const i=sel,ctl=(i>0?DATA.days[i-1].ctl:raw.ctl);
  openSheet(`<div class="sh-top"><h2>Strain</h2>${X}</div>
    <div class="sh-big" style="color:${STRAIN_C}">${s.score}<small>${esc(s.band)}</small></div>
    <p class="sh-desc">How hard the day was compared with your usual day of training. A typical session lands around 50–75; the scale gets harder to climb as it goes up.</p>
    <div class="kv"><span>Training load</span><b>${s.load}</b>${ctl?`<span>Your usual day (fitness)</span><b>${Math.round(ctl)}</b>`:""}</div>
    <div class="kv"><span>Light</span><b>0–29</b><span>Moderate</span><b>30–59</b><span>High</span><b>60–79</b><span>Max</span><b>80–100</b></div>
    <div class="sec-h"><h2>Last 30 days</h2></div>${bars30("strain",STRAIN_C)}`);
}

/* ------------------------------------------------------------ "something's off" notes */
const OFF={too_high:"The score feels too high",too_low:"The score feels too low",signal:"A signal looks wrong",other:"Something else"};
function openOff(){
  const raw=DATA.days[sel],prev=raw.note||JSON.parse(LS.get("note:"+raw.date)||"null")||{};
  let kind=prev.kind||"";
  openSheet(`<div class="sh-top"><h2>Something off?</h2>${X}</div>
    <p class="sh-desc">Note it now while it's fresh. After a few weeks these notes, together with how your sessions felt, are used to retune the score.</p>
    <div class="picks">${Object.entries(OFF).map(([k,t])=>`<button data-o="${k}" class="${k===kind?"on":""}">${t}</button>`).join("")}</div>
    <div class="field"><label for="o-tx">What happened (optional)</label><textarea id="o-tx" placeholder="e.g. legs felt great on the climbs">${esc(prev.text||"")}</textarea></div>

    status:c=>c.value<c.lo?[c.lo-c.value<1?"Just below normal":`${Math.round(c.lo-c.value)} ms below normal`,"var(--amber)"]:c.value>c.hi?[c.value-c.hi<1?"Just above normal":`${Math.round(c.value-c.hi)} ms above normal`,"var(--alpine)"]:["Within normal","var(--muted)"]},
  rhr:{name:"Resting HR",unit:"bpm",fmt:v=>Math.round(v),weight:"15%",

    status:c=>c.value>c.hi?[`${Math.max(1,Math.round(c.value-c.base))} bpm above average`,"var(--amber)"]:c.value<c.lo?["Below normal","var(--alpine)"]:["Within normal","var(--muted)"]},
  sleep:{name:"Sleep",unit:"h",fmt:v=>hm(v),weight:"20%",

    status:c=>c.value<c.lo?[`Below your minimum of ${hmh(c.lo)}`,"var(--amber)"]:c.value<c.hi?[`${hmh(c.hi-c.value)} under your usual`,"var(--muted)"]:["At or above your usual","var(--muted)"]},

function series(key,n){
  return DATA.days.slice(Math.max(0,sel-n+1),sel+1).map(d=>({date:d.date,c:d.comp?.[key]||null}));

function spark(key){
  const s=series(key,14),vals=s.filter(x=>x.c).map(x=>x.c.value);
  if(vals.length<2) return "";

  const pts=s.map((p,i)=>p.c?`${x(i).toFixed(1)},${y(p.c.value).toFixed(1)}`:null).filter(Boolean);
  const band=last.lo!=null?`<rect x="0" y="${y(last.hi)}" width="92" height="${Math.max(1,y(last.lo)-y(last.hi))}" fill="var(--text)" opacity=".06"/>`:"";
  const [lx,ly]=pts[pts.length-1].split(",");
  return `<svg viewBox="0 0 92 34" preserveAspectRatio="none" aria-hidden="true">${band}
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>

}

/* streak: consecutive weeks with at least one activity (the current week keeps it alive until it ends) */
function streakInfo(){
  const weeks=new Set(Object.keys(DATA.volume||{}).map(mondayOf)),cur=mondayOf(todayISO());
  const step=(iso,k)=>{const d=new Date(iso+"T12:00");d.setDate(d.getDate()+7*k);return isoD(d);};
  let n=0,w=weeks.has(cur)?cur:step(cur,-1);
  while(weeks.has(w)){n++;w=step(w,-1);}
  const last=[...Array(12)].map((_,i)=>{const s=step(cur,i-11);return {start:s,on:weeks.has(s),cur:s===cur};});
  // best streak ever, for the restart messages
  const all=[...weeks].sort();let best=0,run=0,prev=null;
  for(const w0 of all){run=prev&&step(prev,1)===w0?run+1:1;best=Math.max(best,run);prev=w0;}
  return {n,thisWeek:weeks.has(cur),last,best};
}

function weekSection(){

  const letters=["M","T","W","T","F","S","S"];

let volMode=(()=>LS.get("rd_vol")||"week")(),volPick=null;
function volBuckets(mode){
  const t=todayISO(),out=[];
  if(mode==="week"){let m=mondayOf(t);for(let i=0;i<12;i++){const d=new Date(m+"T12:00");d.setDate(d.getDate()-7*i);const s=isoD(d),e=new Date(d);e.setDate(e.getDate()+6);
      out.unshift({label:fmtDay(s,{day:"numeric",month:"short"}),title:`Week of ${fmtDay(s,{day:"numeric",month:"long"})}`,o:sumRange(s,isoD(e)),short:i===0?"This":fmtDay(s,{day:"numeric"})});}}
  else if(mode==="month"){const n=new Date(t+"T12:00");for(let i=0;i<12;i++){const d=new Date(n.getFullYear(),n.getMonth()-i,1,12),e=new Date(d.getFullYear(),d.getMonth()+1,0,12);
      out.unshift({title:d.toLocaleDateString("en-GB",{month:"long",year:"numeric"}),o:sumRange(isoD(d),isoD(e)),short:d.toLocaleDateString("en-GB",{month:"narrow"})});}}

  const c=day.comp||{};
  const label=isToday?"Today":fmtDay(raw.date,{weekday:"short",day:"numeric",month:"short"});
  const chev=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

  $("app").innerHTML=`
  <div class="top">
    <div class="daypick">
      <button class="chev" id="prev" aria-label="Previous day" ${sel<=0?"disabled":""}>${chev("M15 18l-6-6 6-6")}</button>
      <span class="d">${esc(label)}</span>
      <button class="chev" id="next" aria-label="Next day" ${sel>=DATA.days.length-1?"disabled":""}>${chev("M9 18l6-6-6-6")}</button>
    </div>
    <button class="gear" id="gear" aria-label="Settings">${GEAR}</button>
  </div>
  <div class="g-wrap"><button class="gauge" id="gauge" aria-label="Score details">${gaugeSVG(has?day.score:null,band,color)}</button>${legendHTML(has?band:"")}</div>
  <p class="adj">${has?esc(deltaTxt(day)):""}</p>
  ${has?`<button class="verdict-b" id="guide"><span class="verdict">${esc(day.advice)}</span><span class="why">${esc(day.why)}</span><span class="more">What this means for today</span></button>`:""}
  ${isToday&&!has?pendingNote():""}
  ${duo(raw,isToday)}
  ${has?`<button class="off" id="off">Score doesn't feel right?</button>`:""}

  <section class="sec"><div class="sec-h"><h2>Signals</h2><span>Tap for history</span></div>
    <div class="signals">${["hrv","rhr","sleep","load"].map(k=>signalRow(k,c[k])).join("")}</div>
    ${isToday?tonightCard():""}</section>

  ${isToday?checkin(raw):""}
  ${sessions(raw)}
  <p class="foot">Updated ${esc(new Date(DATA.generated_at).toLocaleString("en-GB",{weekday:"long",hour:"2-digit",minute:"2-digit"}))}<br>Calibrated on ${DATA.calibration.n} days of your data</p>`;

  if(has){animateGauge(prevScore,day.score); prevScore=day.score;}
  const u=$("upd"); if(u) u.onclick=()=>requestUpdate(u);
  bind(raw);
}

function bind(raw){
  $("prev").onclick=()=>go(sel-1); $("next").onclick=()=>go(sel+1);
  $("gear").onclick=openSettings; $("gauge").onclick=()=>openScore();
  const g=$("guide"); if(g) g.onclick=()=>openGuide();
  $("m-sleep").onclick=openSleepScore; $("m-strain").onclick=openStrain;
  const of=$("off"); if(of) of.onclick=openOff;
  const tn=$("tonight"); if(tn) tn.onclick=()=>{ if(DATA.days[sel].comp?.sleep) openSignal("sleep"); };
  document.querySelectorAll(".sig[data-sig]").forEach(b=>b.onclick=()=>openSignal(b.dataset.sig));
  document.querySelectorAll(".trend rect[data-i]").forEach(r=>r.onclick=()=>go(+r.dataset.i));
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,v=+b.dataset.v;
    if(k==="sick") draft.sick=draft.sick===!!v?undefined:!!v; else draft[k]=draft[k]===v?undefined:v;
    Object.keys(draft).forEach(x=>draft[x]===undefined&&delete draft[x]);
    const y=scrollY; render(); scrollTo(0,y);
  });
  const s=$("qsave"); if(s) s.onclick=()=>saveAnswers(raw);
}
function go(i){ if(i<0||i>=DATA.days.length) return; sel=i; draft={...(DATA.days[sel].answers||{})}; render(); }

/* ------------------------------------------------------------ sheets */
function openSheet(html){ $("sheet").innerHTML=`<div class="grab"></div>${html}`; $("sheet").classList.add("open"); $("scrim").classList.add("open");
  const x=$("sheet").querySelector(".x"); if(x){x.onclick=closeSheet; x.focus();} }
function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("open"); }
$("scrim").onclick=closeSheet; addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const X=`<button class="x" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;

const BETTER={hrv:1,rhr:-1,sleep:1,load:1};
function sigClass(key,v,c){
  if(key==="load") return v< -30?"worse":v> -10?"better":"in";
  if(key==="sleep") return v<c.lo?"worse":"in";
  if(v>=c.lo&&v<=c.hi) return "in";
  return (v>c.hi)===(BETTER[key]>0)?"better":"worse";
}
const CLS_COL={in:"var(--text)",better:"var(--alpine)",worse:"var(--amber)"};
const CLS_TXT={in:"within your normal",better:"better than normal",worse:"worse than normal"};
const fmtVal=(key,v)=>key==="sleep"?hm(v):key==="load"?`${v>0?"+":""}${Math.round(v)}%`:`${Math.round(v)} ${SIG[key].unit}`;
let chartPick=null;
function sigChart(key,n){
  const s=series(key,n),cur=DATA.days[sel].comp[key];
  if(s.filter(p=>p.c).length<2) return "<p class='sh-desc'>Not enough data yet.</p>";
  const W=320,H=170,PL=4,PR=62,PT=12,PB=8;
  const refs=key==="sleep"?[[cur.hi,"usual "+hm(cur.hi),"solid"],[cur.lo,"min "+hm(cur.lo),"dash"]]:key==="load"?[[-10,"−10%","dash"],[-30,"−30%","dash"]]
    :[[cur.hi,fmtNum(cur.hi),"dash"],[cur.base,"avg "+fmtNum(cur.base),"solid"],[cur.lo,fmtNum(cur.lo),"dash"]];
  const vals=s.filter(p=>p.c).map(p=>p.c.value).concat(refs.map(r=>r[0]),key==="hrv"?s.filter(p=>p.c).map(p=>p.c.avg7):[]);
  let lo=Math.min(...vals),hi=Math.max(...vals); const pad=(hi-lo)*.1||1; lo-=pad; hi+=pad;
  const y=v=>PT+(hi-v)/(hi-lo)*(H-PT-PB),x=i=>PL+(i+.5)*((W-PL-PR)/s.length);
  const bandTop=key==="load"?-10:cur.hi,bandBot=key==="load"?-30:cur.lo;
  const pick=chartPick==null||chartPick>=s.length||!s[chartPick].c?s.map(p=>!!p.c).lastIndexOf(true):chartPick;
  const line=s.map((p,i)=>p.c?`${x(i).toFixed(1)},${y(p.c.value).toFixed(1)}`:null).filter(Boolean).join(" ");
  const avg=key==="hrv"?`<polyline points="${s.map((p,i)=>p.c?`${x(i).toFixed(1)},${y(p.c.avg7).toFixed(1)}`:null).filter(Boolean).join(" ")}" fill="none" stroke="var(--glacier)" stroke-width="1.6" stroke-dasharray="1 0" opacity=".55"/>`:"";
  const r=n>7?3.2:4.6;
  const dots=s.map((p,i)=>{if(!p.c) return ""; const k=sigClass(key,p.c.value,cur);
    return `<circle cx="${x(i)}" cy="${y(p.c.value)}" r="${i===pick?r+2:r}" fill="${i===pick?CLS_COL[k]:"var(--surface)"}" stroke="${CLS_COL[k]}" stroke-width="2"/>`;}).join("");
  const hits=s.map((p,i)=>`<rect data-pi="${i}" x="${x(i)-(W-PL-PR)/s.length/2}" y="0" width="${(W-PL-PR)/s.length}" height="${H}" fill="transparent" style="cursor:pointer"/>`).join("");
  const pk=s[pick],pc=sigClass(key,pk.c.value,cur);
  return `<div class="readout"><span>${fmtDay(pk.date,{weekday:"short",day:"numeric",month:"short"})}</span>
      <b>${fmtVal(key,pk.c.value)}</b><em style="color:${CLS_COL[pc]}">${CLS_TXT[pc]}</em></div>
    <div class="sh-chart"><svg viewBox="0 0 ${W} ${H}">
      <rect x="${PL}" y="${y(bandTop)}" width="${W-PL-PR}" height="${Math.max(0,y(bandBot)-y(bandTop))}" fill="var(--alpine)" opacity=".08"/>
      ${refs.map(([v,l,t])=>`<line x1="${PL}" x2="${W-PR+4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--muted)" stroke-width="1" ${t==="dash"?'stroke-dasharray="3 4"':""} opacity=".6"/>
        <text x="${W-PR+8}" y="${y(v)+4}" class="rl">${l}</text>`).join("")}
      <line x1="${x(pick)}" x2="${x(pick)}" y1="${PT}" y2="${H-PB}" stroke="var(--muted)" stroke-width="1" opacity=".5"/>
      ${avg}<polyline points="${line}" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linejoin="round" opacity=".85"/>
      ${dots}${hits}
    </svg>
    <div class="ax"><span>${fmtDay(s[0].date,{day:"numeric",month:"short"})}</span><span>${fmtDay(s[s.length-1].date,{day:"numeric",month:"short"})}</span></div>
    <div class="legend"><span><i style="border-color:var(--text)"></i>Within normal</span><span><i style="border-color:var(--alpine)"></i>Better</span><span><i style="border-color:var(--amber)"></i>Worse</span>${key==="hrv"?`<span><i class="ln"></i>7-day average</span>`:""}</div>
    <div class="lg">${key==="sleep"?"The solid line is your usual night, the dashed line your minimum, both learned from your last 30 nights.":key==="load"?"Dashed lines mark the productive range, −10% to −30%.":"Dashed lines mark the edges of your normal range, the solid line your average. Tap a point to read it."}</div></div>`;
}
function fmtNum(v){return Number.isInteger(v)?String(v):v.toFixed(1).replace(/\.0$/,"");}
const hmh=h=>{const m=Math.round(h*60);return m<60?`${m} min`:`${Math.floor(m/60)}h${m%60?String(m%60).padStart(2,"0"):""}`;};
function sleepPlan(){
  let i=sel; while(i>=0&&!DATA.days[i].comp?.sleep) i--;
  if(i<0) return null;
  const c=DATA.days[i].comp.sleep,usual=c.hi,min=c.lo,avg3=c.avg3;
  const debt=Math.max(0,(usual-avg3)*3);
  const extra=Math.min(.75,debt*.5);
  const t=DATA.days[sel],tm=new Date(new Date(t.date+"T12:00").getTime()+864e5).toLocaleDateString("sv-SE");
  const todayLoad=(t.workouts||[]).reduce((a,w)=>a+(w.load||0),0);
  const tomorrowLoad=((DATA.upcoming||{})[tm]||[]).reduce((a,p)=>a+(p.load||0),0);
  const hard=todayLoad>=100||tomorrowLoad>=100?.25:0;
  let rec=Math.max(7,usual+Math.min(.75,extra+hard)); rec=Math.min(9,Math.round(rec*4)/4);
  const why=[];
  if(extra>=.25) why.push(`you're about ${hmh(debt)} short over the last three nights`);
  if(hard) why.push(todayLoad>=100?"today's session was a big one":"tomorrow's session is a big one");
  if(usual<7&&rec===7) why.push("7 hours is the floor for adults who train");
  return {rec,usual,min,why};
}
function sleepAdvice(){
  const p=sleepPlan(); if(!p) return "";
  const parts=[`Your usual night is ${hmh(p.usual)}, so that's the baseline.`];
  if(p.why.length) parts.push(`A little more tonight because ${p.why.join(" and ")}.`);
  else parts.push("You're not carrying a sleep debt, so your usual amount is enough.");
  return `<div class="note-card sl"><b>Tonight: ${hmh(p.rec)} of sleep.</b> ${esc(parts.join(" "))} Try not to go below ${hmh(Math.max(p.min,6.5))}, where your short nights start to cost you.</div>`;
}
function tonightCard(){
  const p=sleepPlan(); if(!p) return "";
  const moon=`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>`;
  return `<button class="tonight" id="tonight"><span class="tn-ic">${moon}</span>
    <span class="tn-t"><b>Tonight, aim for ${hmh(p.rec)}</b><span>${p.why.length?esc(p.why[0][0].toUpperCase()+p.why[0].slice(1))+".":"Your usual amount is enough."}</span></span></button>`;
}
function openSignal(key,n=7,keepPick=false){
  if(!keepPick) chartPick=null;
  const m=SIG[key],c=DATA.days[sel].comp[key];
  const stats={
    hrv:[["Last night",`${Math.round(c.value)} ms`],["7-day average",`${c.avg7} ms`],["Your normal",`${Math.round(c.lo)}–${Math.round(c.hi)} ms`],["Weight in score",m.weight]],
    rhr:[["Last night",`${c.value} bpm`],["Your average",`${c.base} bpm`],["Your normal",`${c.lo}–${c.hi} bpm`],["Weight in score",m.weight]],
    sleep:[["Last night",hm(c.value)],["3-night average",hm(c.avg3)],["Your usual",hm(c.hi)],["Your minimum",hm(c.lo)]],
    load:[["Form",`${c.value>0?"+":""}${c.value}%`],["Fitness / fatigue",`${c.ctl} / ${c.atl}`],["Productive range","−30% to −10%"],["Weight in score",m.weight]],
  }[key];
  const keepScroll=$("sheet").scrollTop;
  openSheet(`<div class="sh-top"><h2>${m.name}</h2>${X}</div>
    <div class="sh-big">${m.fmt(c.value)}<small>${key==="sleep"?"h":m.unit}</small></div>
    ${key==="sleep"?sleepAdvice():""}
    <p class="sh-desc">${m.desc}</p>
    <div class="range"><button data-n="7" class="${n===7?"on":""}">7 days</button><button data-n="30" class="${n===30?"on":""}">30 days</button></div>
    ${sigChart(key,n)}
    <div class="stats">${stats.map(s=>`<div><span>${s[0]}</span><b>${s[1]}</b></div>`).join("")}</div>`);
  if(keepPick) $("sheet").scrollTop=keepScroll;
  $("sheet").querySelectorAll(".range button").forEach(b=>b.onclick=()=>openSignal(key,+b.dataset.n));
  $("sheet").querySelectorAll("rect[data-pi]").forEach(r=>r.onclick=()=>{chartPick=+r.dataset.pi; openSignal(key,n,true);});
}
const GUIDE={
  "Super":["Recovery is better than on most of your days.","If there's a test or a hard session on the plan, this is a good day for it.","If the legs agree, aim for the upper part of the target range, or add a little extra."],
  "Normal":["This is a normal day for you: most of your days land here.","Train as planned.","In the hard parts, let the legs decide: if the effort feels heavier than usual, settle at the lower end of the range."],
  "Low":["Recovery is below your usual, but the score can't feel your legs: you can.","Start the session as planned and use the first 15–20 minutes to check in.","Legs feel good: carry on, maybe at the lower end of the targets.","Legs feel heavy: drop the watts a little, or do one repetition less.","Legs feel cooked: turn it into easy endurance and save the quality for another day."],
  "Very low":["Several signals are well below your usual. Sometimes it's fatigue, sometimes a cold on the way, sometimes just a bad night.","If you feel fine, an easy or shortened session is a reasonable choice.","If you also feel off, a rest day or a very easy spin will pay back more than forcing it.","If it stays this low for a few days, look at sleep, stress and how you feel overall."],
};
function openGuide(){
  const raw=DATA.days[sel],isT=raw.date===todayISO(),day=isT?applyAnswers(raw,Object.keys(draft).length?draft:raw.answers):raw;
  const g=GUIDE[bandOf(day.score)[1]]||GUIDE.Normal,col=segColor(day.score);
  openSheet(`<div class="sh-top"><h2>Reading today's score</h2>${X}</div>
    <div class="sh-big" style="color:${col}">${day.score}<small>${esc(day.band)}</small></div>
    <p class="sh-desc">${esc(g[0])}</p>
    <ul class="guide">${g.slice(1).map(t=>`<li>${esc(t)}</li>`).join("")}</ul>
    <div class="note-card"><b>You have the final say.</b> The score measures how your body has recovered overnight; it can't feel your legs or know your day. Use it as context, then decide with how you actually feel on the bike.</div>`);
}
function openSettings(){
  openSheet(`<div class="sh-top"><h2>Settings</h2>${X}</div>
    <div class="field"><label for="s-pw">Passphrase</label><input id="s-pw" type="password" value="${esc(LS.get("rd_pass")||"")}"></div>
    <div class="field"><label for="s-tk">GitHub token</label><input id="s-tk" type="password" placeholder="Not set" value="${esc(LS.get("rd_token")||"")}">
      <p>Needed only to sync the check-in, so the server recalculates the score. Fine-grained token, access to this repository only, with Contents and Actions set to read and write.</p></div>
    <button class="btn quiet" id="s-val" style="width:100%;margin-top:18px">Score check</button>
    <div class="savebar" style="margin-top:22px"><button class="btn quiet" id="s-out">Lock app</button><button class="btn" id="s-save">Save settings</button></div>`);
  $("s-save").onclick=()=>{const p=$("s-pw").value.trim(),t=$("s-tk").value.trim();
    if(p) LS.set("rd_pass",p); t?LS.set("rd_token",t):LS.del("rd_token"); closeSheet(); load();};
  $("s-out").onclick=()=>{LS.del("rd_pass"); closeSheet(); lock();};
  $("s-val").onclick=openValidation;
}

/* ------------------------------------------------------------ save check-in */
async function saveAnswers(raw){
  const st=$("qst"),btn=$("qsave"); btn.disabled=true;
  LS.set("ans:"+raw.date,JSON.stringify(draft));
  Object.assign(raw,applyAnswers(raw,{...draft}));
  const token=LS.get("rd_token");
  const done=msg=>{const y=scrollY; render(); scrollTo(0,y); $("qst").textContent=msg;};
  if(!token) return done("Saved on this phone. Add a GitHub token in settings to sync.");
  st.textContent="Saving…";
  try{
    const owner=location.hostname.split(".")[0],repo=location.pathname.split("/").filter(Boolean)[0];
    const url=`https://api.github.com/repos/${owner}/${repo}/contents/answers/${raw.date}.json`;
    const hdr={Authorization:"Bearer "+token,Accept:"application/vnd.github+json"};
    let sha; const cur=await fetch(url,{headers:hdr}); if(cur.ok) sha=(await cur.json()).sha;
    const env=await encryptObj({date:raw.date,...draft},LS.get("rd_pass"));
    const r=await fetch(url,{method:"PUT",headers:{...hdr,"Content-Type":"application/json"},
      body:JSON.stringify({message:"Check-in "+raw.date,content:btoa(JSON.stringify(env)),...(sha?{sha}:{})})});
    if(!r.ok) throw new Error("GitHub "+r.status);
    done("Saved and synced. The server updates in a couple of minutes.");
  }catch(e){ done(`Saved on this phone only (${e.message}).`); }
}

load();
</script>
</body>
