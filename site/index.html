<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Readiness">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo-180.png">
<link rel="icon" href="logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Readiness</title>
<style>
:root{
  --bg:#121a26;--surface:#1a2433;--surface2:#212d3f;--line:#2a3749;
  --text:#eceff4;--muted:#8c98ab;--faint:#5f6c80;
  --rose:#e2687a;--hr:#f07a8c;--pw:#b07cf0;--b1:#a45bd9;--b2:#6b6cf2;--b3:#3a9cf5;--b4:#2cc9c0;--b5:#5fe08a;--amber:#e9a15a;--s1:#ff5d6c;--s2:#f7c948;--s3:#34d399;--s4:#4aa3ff;--sand:#d9c46a;--alpine:#5fc795;--glacier:#6fd3e6;
  --z1:#7d8798;--z2:#3e8ede;--z3:#3fb97a;--z4:#e5c33f;--z5:#ee8a3a;--z6:#e04f5f;--z7:#9b6ce0;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --ui:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--ui)}
body{padding:env(safe-area-inset-top) 18px calc(96px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% -10%,#1d2a3d 0%,var(--bg) 60%) fixed}
main{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glacier);outline-offset:2px;border-radius:8px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.daypick{display:flex;align-items:center;gap:2px}
.daypick .d{font-family:var(--cond);font-size:24px;font-weight:500;letter-spacing:.01em;padding:0 4px}
.chev{background:none;border:0;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);cursor:pointer;border-radius:10px}
.chev:disabled{opacity:.25;cursor:default}
.chev svg,.gear svg{width:20px;height:20px}
.gear{background:none;border:0;color:var(--muted);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:12px}

/* gauge */
.g-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px auto 0;max-width:360px}
.gauge{position:relative;display:block;flex:0 1 230px;min-width:0;background:none;border:0;padding:0;cursor:pointer}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.g-num{font-family:var(--cond);font-weight:300;font-size:74px;letter-spacing:-.025em;fill:var(--text)}
.g-band{font-family:var(--ui);font-weight:600;font-size:11.5px;letter-spacing:.16em}
.g-of{font-family:var(--ui);font-size:10.5px;letter-spacing:.14em;fill:var(--faint)}
.g-legend{list-style:none;margin:0;padding:0;display:grid;gap:7px;flex:none}
.g-legend li{display:grid;grid-template-columns:6px auto;column-gap:7px;align-items:center;opacity:.42;transition:opacity .3s}
.g-legend li.on{opacity:1}
.g-legend i{width:6px;height:6px;border-radius:50%;grid-row:span 2}
.g-legend b{font:600 9.5px/1.1 var(--ui);letter-spacing:.07em;text-transform:uppercase;color:var(--text)}
.g-legend span{font:400 9px/1.2 var(--ui);color:var(--muted);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.mini{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:20px;padding:16px 16px;cursor:pointer;text-align:left;color:var(--text);min-width:0}
.mini svg{flex:none;width:64px;height:64px}
.mini .mn{font-family:var(--cond);font-size:20px;font-weight:500;fill:var(--text)}
.mini .mt{min-width:0}
.mini .mt small{display:block;font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.mini .mt b{display:block;font-size:17px;font-weight:600;margin-top:2px}
.mini .mt span{display:block;font-size:13px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.off{display:block;margin:16px auto 0;background:none;border:0;color:var(--faint);font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.picks{display:grid;gap:8px;margin:14px 0}
.picks button{background:var(--surface2);border:1px solid transparent;border-radius:12px;padding:13px 14px;text-align:left;color:var(--text);cursor:pointer;font-size:15px}
.picks button.on{border-color:var(--glacier);background:rgba(111,211,230,.08)}
.field textarea{width:100%;min-height:84px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;resize:vertical}
.bars30 svg{display:block;width:100%;height:auto}
.stg{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px;margin:6px 0 8px}
.stg i{display:block;min-width:2px}
.stg-k{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.stg-k i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.stg-k b{color:var(--text);font-weight:600}
.mks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mk{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:16px;padding:12px 12px 11px;text-align:left;color:var(--text);cursor:pointer;min-width:0}
.mk small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.mk b{display:block;font-family:var(--cond);font-size:30px;font-weight:400;line-height:1.1;margin-top:4px}
.mk b u{text-decoration:none;font-family:var(--ui);font-size:11px;color:var(--faint);margin-left:3px;font-weight:500}
.mk span{display:block;font-size:11.5px;color:var(--faint);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk span.up{color:var(--alpine)}.mk span.down{color:var(--amber)}
.alert{display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,rgba(255,93,108,.16),rgba(255,93,108,.06));border:1px solid rgba(255,93,108,.35);border-radius:16px;padding:13px 14px;margin:14px 0 0}
.alert .ai{flex:none;width:30px;height:30px;border-radius:10px;background:rgba(255,93,108,.2);color:#ff8a95;display:grid;place-items:center}
.alert b{display:block;font-size:15px}.alert span{font-size:13.5px;color:var(--muted)}
.nudge{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;margin-top:12px;color:var(--text);text-decoration:none}
.nudge .ni{flex:none;width:30px;height:30px;border-radius:10px;background:rgba(242,166,90,.15);color:#f2a65a;display:grid;place-items:center}
.nudge b{display:block;font-size:14.5px;font-weight:600}.nudge span{font-size:13px;color:var(--muted)}
.wr{background:var(--surface);border-radius:18px;padding:16px}
.wr-h{font-size:14.5px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.wr-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.wr-g div{background:var(--surface2);border-radius:12px;padding:10px 12px}
.wr-g small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
.wr-g b{font-family:var(--cond);font-size:26px;font-weight:400}
.wr-g em{font-style:normal;font-size:12px;margin-left:6px;color:var(--faint)}
.wr-g em.up{color:var(--alpine)}.wr-g em.down{color:var(--amber)}
.wr-m{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px;color:var(--muted)}
.wr-m b{color:var(--text);font-weight:600}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}
.tog label{font-size:15px}.tog p{font-size:13px;color:var(--faint);margin:4px 0 0}
.day4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day4 .en-c{cursor:pointer;color:var(--text);text-align:left;font:inherit}
.en-c b em{font-style:normal;font-family:var(--ui);font-size:12px;font-weight:500;margin-left:6px}
.st-bar{display:flex;gap:3px;margin:8px 0 6px}.st-bar i{flex:1;height:6px;border-radius:99px;opacity:.22}.st-bar i.on{opacity:1}
.en-c{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:18px;padding:12px 14px;min-width:0}
.en-c small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.en-c b{display:block;font-family:var(--cond);font-size:28px;font-weight:400;line-height:1.15;margin-top:2px}
.en-c b u{text-decoration:none;font-family:var(--ui);font-size:12px;color:var(--faint);margin-left:4px;font-weight:500}
.en-c span{display:block;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.en-bar{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 0 6px;display:flex}
.en-bar i{display:block;height:100%}
.en-parts{display:grid;gap:8px;margin:6px 0 16px}
.en-parts div{display:flex;align-items:center;gap:10px;font-size:14.5px}
.en-parts i{width:10px;height:10px;border-radius:3px;flex:none}
.en-parts span{flex:1;color:var(--muted)}.en-parts b{font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14.5px;margin:6px 0 16px}
.kv span{color:var(--muted)}.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.vrow{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.vrow span{color:var(--muted)}
.vnote{padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.vnote em{font-style:normal;color:var(--faint);font-size:12.5px}
.adj{text-align:center;font-size:13px;color:var(--muted);min-height:18px;margin-top:6px}
.verdict{text-align:center;font-size:18px;font-weight:500;margin:10px 0 4px;text-wrap:balance;color:var(--text)}
.why{text-align:center;font-size:14.5px;color:var(--muted);margin:0 16px;text-wrap:balance}
.pending{background:var(--surface);border-radius:18px;padding:16px;margin-top:14px;text-align:center}
.pending p{margin:0 0 12px;color:var(--muted);font-size:14.5px}
.pending .st{margin:10px 0 0;font-size:13.5px}
.pending a.btn{display:inline-block;text-decoration:none;padding:13px 22px}
.notice{font-size:14px;color:var(--muted);text-align:center;margin:12px 0 0}

/* sections */
.sec{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.sec-h h2{font-family:var(--cond);font-size:22px;font-weight:500;margin:0;letter-spacing:.01em}
.sec-h span{font-size:13px;color:var(--faint)}

/* signals */
.signals{border-top:1px solid var(--line)}
.sig{display:grid;grid-template-columns:1fr 92px 86px;align-items:center;gap:10px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;text-align:left;cursor:pointer}
.sig .n{font-weight:600;font-size:16px}
.sig .s{font-size:13.5px;color:var(--muted);margin-top:1px}
.sig .s i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sig svg{width:92px;height:34px;display:block}
.sig .v{font-family:var(--cond);font-size:30px;font-weight:400;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.sig .v small{font-size:14px;color:var(--muted);margin-left:2px}

/* sessions */
.wcard{display:block;background:var(--surface);border-radius:18px;padding:16px;margin-bottom:10px;color:var(--text);text-decoration:none}
.wcard:active{background:var(--surface2)}
.w-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface2);padding:4px 10px;border-radius:99px}
.tag.done{color:#0e2b22;background:var(--b5)}
.go{width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--muted);flex:none}
.w-name{font-family:var(--cond);font-size:26px;font-weight:500;line-height:1.1}
.w-meta{font-size:14px;color:var(--muted);margin-top:4px}
.prof{width:100%;height:78px;display:block;margin-top:14px;border-radius:6px}
.prof-lg{display:flex;gap:14px;font-size:12.5px;color:var(--faint);margin-top:6px}
.prof-lg i{display:inline-block;vertical-align:2px;margin-right:6px}
.prof-lg i.sw{width:14px;height:8px;border-radius:2px}
.prof-lg i.ln{width:14px;height:0;border-top:2px solid var(--hr)}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.mgrid span{display:block;font-size:12.5px;color:var(--muted)}
.mgrid b{font-family:var(--cond);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.mgrid b small{font-size:13px;color:var(--muted);margin-left:3px;font-weight:400}
.w-foot{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.w-foot{align-items:center}
.w-foot b{color:var(--text);font-weight:600}
.feel{display:inline-flex;align-items:center;gap:8px}
.wcard.rest .w-name{font-size:21px}
.callink{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;color:var(--text);text-decoration:none}
.callink:active{background:var(--surface)}
.cal-ic{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--b3);flex:none}
.cal-t{flex:1}
.cal-t b{display:block;font-weight:600}
.cal-t span{font-size:13.5px;color:var(--muted)}
.feelpip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--text);font-size:13px;margin-left:6px}

/* check-in */
.checkin{background:var(--surface);border-radius:18px;padding:18px 16px}
.checkin .lead{font-size:14px;color:var(--muted);margin:0 0 18px}
.qq{margin-bottom:22px}
.qq h3{font-size:16px;font-weight:600;margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{background:var(--surface2);border:1px solid transparent;border-radius:12px;height:46px;cursor:pointer;
  font-family:var(--cond);font-size:22px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.seg.two button{font-family:var(--ui);font-size:15px;font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
.anchor{min-height:42px;margin-top:9px;font-size:14px;color:var(--muted)}
.anchor b{color:var(--text);font-weight:600}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.savebar .st{font-size:13.5px;color:var(--muted)}
.btn{background:var(--glacier);color:#0c2a31;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.quiet{background:var(--surface2);color:var(--text)}

/* trend */
.trend{background:var(--surface);border-radius:18px;padding:16px 14px 10px}
.trend svg{width:100%;height:118px;display:block}
.trend .ax{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:6px}

.card{background:var(--surface);border-radius:18px;padding:16px}
.wk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wk-stat span{display:block;font-size:12.5px;color:var(--muted)}
.wk-stat b{font-family:var(--cond);font-size:26px;font-weight:500;font-variant-numeric:tabular-nums}
.wk-stat b small{font-size:15px;color:var(--faint);font-weight:400;margin-left:4px}
.wk-bar{height:4px;border-radius:99px;background:var(--surface2);margin-top:6px;overflow:hidden}
.wk-bar i{display:block;height:100%;background:var(--b3);border-radius:99px}
.wk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:20px}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 6px;border-radius:12px}
.wk-day.today{background:var(--surface2)}
.wk-day span{font-size:12px;color:var(--muted);font-weight:600}
.wk-day i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.wk-day.done i{background:var(--b5);border-color:var(--b5)}
.wk-day.plan i{border-color:var(--b3)}
.wk-day.missed i{border-color:var(--amber);border-style:dashed}
.wk-day em{font-style:normal;font-family:var(--cond);font-size:14px;color:var(--muted)}
.wk-day.done em{color:var(--text)}
.wk-key{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint);margin-top:10px}
.wk-key .r{margin-left:auto}
.wk-key i.k{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid;margin-right:5px;vertical-align:-1px}
.wk-key i.done{background:var(--b5);border-color:var(--b5)}.wk-key i.plan{border-color:var(--b3)}.wk-key i.missed{border-color:var(--amber);border-style:dashed}
.wk-hist-h{font-size:12.5px;color:var(--muted);margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.wk-hist{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:84px}
.wk-h{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.wk-h i{display:block;width:100%;max-width:30px;border-radius:5px 5px 2px 2px;background:var(--surface2)}
.wk-h.cur i{background:var(--b3)}
.wk-h span{font-size:11px;color:var(--faint)}
.fit-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fit-top span{display:block;font-size:12.5px;color:var(--muted)}
.fit-top span i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.fit-top b{font-family:var(--cond);font-size:28px;font-weight:500}
.fit-day{font-size:13px;color:var(--faint);margin:4px 0 8px}
.fit-svg{width:100%;height:auto;display:block}
.fit .ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:6px;gap:8px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;gap:8px;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));background:rgba(18,26,38,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.tabbar button{flex:0 1 160px;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--faint);cursor:pointer;font-size:12px;font-weight:600}
.tabbar button.on{color:var(--text)}
.ttl{font-family:var(--cond);font-size:30px;font-weight:500}
.streak{margin-top:10px}
.streak .muted-s{margin:10px 0 14px}
.st-weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.st-weeks i{height:10px;border-radius:3px;background:var(--surface2)}
.st-weeks i.on{background:linear-gradient(90deg,#ffb35c,#f0607a)}
.st-weeks i.cur{outline:1.5px solid var(--muted);outline-offset:2px}
.st-ax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:8px}
.muted-s{font-size:13.5px;color:var(--muted);margin:0}
.wk-sp,.vol-sp{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.sp-row{display:grid;grid-template-columns:10px 72px 1fr 66px;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.sp-row i{width:9px;height:9px;border-radius:50%}
.sp-row em{height:5px;border-radius:99px;background:var(--surface2);overflow:hidden}
.sp-row em u{display:block;height:100%;border-radius:99px}
.sp-row b{font-family:var(--cond);font-size:17px;font-weight:500;text-align:right}
.vol .range{margin-bottom:14px}
.vol-read{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vol-read span{font-size:14px;color:var(--muted)}
.vol-read b{font-family:var(--cond);font-size:28px;font-weight:500}
.vol-read em{font-style:normal;font-size:13px;color:var(--faint)}
.vbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;height:130px}
.vbars.few{grid-auto-columns:minmax(0,56px);justify-content:center;gap:18px}
.vb{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:stretch;gap:6px;cursor:pointer;min-width:0}
.vb-col{flex:1;display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;opacity:.62;transition:opacity .15s}
.vb.on .vb-col{opacity:1}

.vb-col u.nil{height:2px;background:var(--line)}
.vb em{font-style:normal;font-size:11px;color:var(--faint);text-align:center}
.vb.on em{color:var(--text)}
.verdict-b{display:block;width:100%;background:none;border:0;padding:6px 10px;cursor:pointer;text-align:center}
.verdict-b .verdict,.verdict-b .why{display:block}
.verdict-b .more{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;font-weight:600;color:var(--b3)}

.guide{margin:0 0 18px;padding:0;list-style:none}
.guide li{position:relative;padding:10px 0 10px 22px;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.guide li::before{content:"";position:absolute;left:4px;top:18px;width:7px;height:7px;border-radius:50%;background:var(--b3)}
.note-card{background:var(--surface2);border-radius:14px;padding:14px 16px;font-size:14.5px;color:var(--muted);line-height:1.5}
.note-card b{color:var(--text)}
.sp-cap{font-size:12.5px;color:var(--muted);margin-bottom:4px}
.st-top{display:flex;align-items:center;gap:14px}
.st-n{display:flex;align-items:baseline;gap:6px}
.st-n b{font-family:var(--cond);font-size:44px;font-weight:500;line-height:1}
.st-n span{font-size:16px;color:var(--muted)}
.st-l{font-size:13.5px;color:var(--faint);margin-top:2px}
.st-quote{font-size:16px;line-height:1.45;margin:14px 0 16px;color:var(--text);font-weight:500}
.tonight{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,#1c2540,#1d2a3d);border:1px solid #2b3858;border-radius:18px;padding:14px 16px;margin-top:14px;cursor:pointer;color:var(--text)}
.tn-ic{width:40px;height:40px;border-radius:12px;background:rgba(107,108,242,.18);color:#a9aaff;display:grid;place-items:center;flex:none}
.tn-t b{display:block;font-weight:600;font-size:15.5px}
.tn-t span{font-size:13.5px;color:var(--muted)}
.note-card.sl{margin:12px 0 4px}
.foot{text-align:center;font-size:12.5px;color:var(--faint);margin-top:26px;line-height:1.6}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,9,15,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:11;max-width:560px;margin:0 auto}
.sheet:not(.open){visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start}
.sh-top h2{font-family:var(--cond);font-size:28px;font-weight:500;margin:0}
.sh-top .x{background:var(--surface2);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.sh-big{font-family:var(--cond);font-size:56px;font-weight:300;line-height:1;margin:10px 0 2px}
.sh-big small{font-size:20px;color:var(--muted);margin-left:8px;font-weight:400}
.sh-desc{color:var(--muted);font-size:14.5px;margin:8px 0 16px}
.range{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:12px}
.range button{background:none;border:0;padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
.range button.on{background:var(--bg);color:var(--text)}
.sh-chart svg{width:100%;height:auto;display:block;overflow:visible}
.sh-chart .ax{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:4px}
.readout{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-height:30px;margin-bottom:4px}
.readout span{font-size:14px;color:var(--muted)}
.readout b{font-family:var(--cond);font-size:24px;font-weight:500}
.readout em{font-style:normal;font-size:14px}
.sh-chart .rl{font-family:var(--cond);font-size:13px;fill:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid;margin-right:6px;vertical-align:0}
.legend i.ln{width:16px;height:0;border-radius:0;border:0;border-top:2px solid var(--glacier);opacity:.7;vertical-align:3px}
.sh-chart .lg{font-size:12.5px;color:var(--faint);margin-top:8px}
.sh-h3{font-family:var(--cond);font-size:21px;font-weight:500;margin:28px 0 4px}
.sh-note{font-size:14px;color:var(--muted);margin:0 0 14px}
.sh-note.warn{color:var(--amber)}
.bd{margin-bottom:14px}
.bd-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bd-t span{font-weight:600}
.bd-t i{font-style:normal;font-weight:400;color:var(--faint);font-size:13px;margin-left:8px}
.bd-t b{font-family:var(--cond);font-size:22px;font-weight:500}
.bd-bar{position:relative;height:6px;border-radius:99px;background:var(--surface2)}
.bd-bar span{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.bd-bar em{position:absolute;top:-3px;width:2px;height:12px;background:var(--muted);border-radius:1px}
.bd-adj{display:flex;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line);margin-top:4px}
.bd-adj b{font-family:var(--cond);font-size:22px;font-weight:500}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:20px}
.stats div span{display:block;font-size:13px;color:var(--muted)}
.stats div b{font-family:var(--cond);font-size:24px;font-weight:500}
.field{margin-top:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font:inherit}
.field p{font-size:13px;color:var(--faint);margin:6px 0 0}

/* lock screen */
.lock{max-width:400px;margin:16vh auto 0}
.lock h1{font-family:var(--cond);font-weight:300;font-size:52px;margin:0}
.lock p{color:var(--muted);margin:4px 0 24px}
.lock .btn{width:100%;margin-top:22px;padding:14px}
.err{color:var(--rose);font-size:14px;margin-top:12px;min-height:20px}
.splash{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:spin-in .9s cubic-bezier(.2,.8,.2,1) both}
.sp-w{font-family:var(--cond);font-weight:300;font-size:34px;letter-spacing:.02em}
@keyframes spin-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.loading{margin-top:42vh;text-align:center;color:var(--muted)}

/* food */
.f-hero{display:block;width:100%;background:none;border:0;color:var(--text);cursor:pointer;padding:0;margin-top:6px;text-align:center}
.fr{display:block;width:210px;height:210px;margin:0 auto}
.fr-n{font-family:var(--cond);font-size:50px;font-weight:300;fill:var(--text)}
.fr-l{font-size:10.5px;font-weight:600;letter-spacing:.14em;fill:var(--muted)}

.f-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.f-stats small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.f-stats b{display:block;font-family:var(--cond);font-size:24px;font-weight:400;margin-top:1px}
.f-sub{font-size:13px;color:var(--faint);margin:8px 0 0}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.mc{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:16px;padding:11px 12px 7px;min-width:0}
.mc small{display:block;font-size:10px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.mc b{display:block;font-family:var(--cond);font-size:23px;font-weight:400;line-height:1.2;white-space:nowrap}
.mc b u{text-decoration:none;font-family:var(--ui);font-size:11.5px;color:var(--faint);font-weight:500}
.meal{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:18px;padding:4px 14px;margin-bottom:10px}
.ml-h{display:flex;align-items:center;gap:10px;padding:8px 0}
.ml-h b{font-size:16px;font-weight:600}.ml-h span{margin-left:auto;font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ml-add{width:34px;height:34px;border-radius:50%;border:0;background:rgba(245,158,11,.15);color:#fbbf24;display:grid;place-items:center;cursor:pointer;flex:none;transition:transform .15s}
.ml-add:active{transform:scale(.9)}
.fi,.fr-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;color:var(--text);text-align:left;cursor:pointer;font:inherit}
.fi .fn,.fr-row .fn{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.fi small,.fr-row small{display:block;font-size:12.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi b,.fr-row b{font-family:var(--cond);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.fr-row b u{text-decoration:none;font-family:var(--ui);font-size:11px;color:var(--faint);font-weight:500;margin-left:3px}
.ml-copy{display:block;width:100%;background:none;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font:inherit;font-size:13.5px;padding:9px;margin:0 0 10px;cursor:pointer}
.goal-c{display:block;width:100%;background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:18px;padding:14px 16px;text-align:left;color:var(--text);cursor:pointer;font:inherit}
.goal-c.empty b{display:block;font-size:16px;font-weight:600}.goal-c.empty span{display:block;font-size:13.5px;color:var(--muted);margin-top:2px}
.gc-row{display:flex;align-items:center;justify-content:space-between}
.gc-row small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.gc-row b{font-family:var(--cond);font-size:30px;font-weight:400}.gc-row b u{text-decoration:none;font-family:var(--ui);font-size:12px;color:var(--faint);margin-left:4px;font-weight:500}
.goal-c>span{display:block;font-size:13px;color:var(--muted)}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bt{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:16px;padding:12px 14px}
.bt small{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;color:var(--muted)}
.bt b{display:block;font-family:var(--cond);font-size:28px;font-weight:400;line-height:1.2}
.bt b u{text-decoration:none;font-family:var(--ui);font-size:11.5px;color:var(--faint);margin-left:4px;font-weight:500}
.bt span{display:block;font-size:12px;color:var(--faint)}
.bal-card{background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:18px;padding:14px;margin-top:10px}
.seg.three{grid-template-columns:repeat(3,1fr)}.seg.three button{height:auto;padding:9px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
.seg.three b{font-family:var(--cond);font-size:21px;font-weight:500}.seg.three span{font-size:12px;opacity:.75}
.seg.four{grid-template-columns:repeat(4,1fr)}.seg.four button,.pp-u button{height:38px;font-family:var(--ui);font-size:13.5px;font-weight:600}
.af-bar{display:flex;gap:8px;margin-top:14px}
.af-in{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:0 12px;color:var(--faint)}
.af-in input{flex:1;background:none;border:0;color:var(--text);font:inherit;padding:13px 0;outline:none;min-width:0}
.af-in:focus-within{border-color:#f59e0b}
.af-ic{width:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--text);display:grid;place-items:center;cursor:pointer}
.af-quick{background:none;border:0;color:#fbbf24;font:inherit;font-size:14px;font-weight:600;padding:10px 0 0;cursor:pointer}
.af-wait{font-size:13.5px;color:var(--faint);display:flex;align-items:center;gap:8px;margin:14px 0}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:#f59e0b;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.pp-t{font-size:24px!important;line-height:1.15;padding-right:10px}
.pp-amt{display:flex;align-items:center;gap:10px;margin:6px 0 10px}
.pp-amt input{flex:1;min-width:0;text-align:center;font-family:var(--cond);font-size:30px;background:var(--bg);border:1px solid var(--line);border-radius:14px;color:var(--text);padding:8px}
.stp{width:52px;height:52px;border-radius:14px;border:0;background:var(--surface2);color:var(--text);font-size:26px;cursor:pointer;transition:transform .12s}
.stp:active{transform:scale(.92)}
.qa-m{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scan{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-top:12px}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.sc-frame{position:absolute;left:12%;right:12%;top:32%;bottom:32%;border:2px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
/* feel */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:20;
  background:#eceff4;color:#121a26;border-radius:14px;padding:11px 16px;font-size:14.5px;font-weight:500;display:flex;gap:14px;align-items:center;
  box-shadow:0 10px 30px rgba(0,0,0,.35);transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#0e7490;font:inherit;font-weight:700;cursor:pointer;padding:0}
#app.enter{animation:enter .28s cubic-bezier(.2,.8,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
#app.swl{animation:swl .26s cubic-bezier(.2,.8,.2,1)}#app.swr{animation:swr .26s cubic-bezier(.2,.8,.2,1)}
@keyframes swl{from{opacity:.2;transform:translateX(28px)}}@keyframes swr{from{opacity:.2;transform:translateX(-28px)}}
.sheet.drag{transition:none}
button:focus-visible{outline:2px solid var(--glacier);outline-offset:2px}

.subtabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid rgba(255,255,255,.04);border-radius:14px;padding:4px;margin:6px 0 14px}
.subtabs button{background:none;border:0;border-radius:10px;padding:9px 0;color:var(--muted);font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;transition:background .2s,color .2s}
.subtabs button.on{background:var(--surface2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}
.f-day{justify-content:center;margin:2px 0 0}
.lib-c{display:flex;align-items:center;gap:12px;width:100%;background:none;border:1px dashed var(--line);border-radius:16px;padding:12px 14px;color:var(--muted);cursor:pointer;text-align:left;font:inherit}
.lib-c span{flex:1}.lib-c b{display:block;color:var(--text);font-size:15px;font-weight:600}.lib-c small{display:block;font-size:12.5px;color:var(--faint)}
.ml-copy.mine{border-style:solid;border-color:rgba(245,158,11,.35);color:#fbbf24;background:rgba(245,158,11,.06)}
.ml-save{display:block;margin:0 0 10px auto;background:none;border:0;color:var(--faint);font:inherit;font-size:12.5px;cursor:pointer;padding:2px 0}
.af-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.af-acts button{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface2);border:0;border-radius:12px;padding:10px 0 8px;color:var(--text);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;transition:transform .12s}
.af-acts button:active{transform:scale(.95)}.af-acts svg{color:#fbbf24}
.af-ai{display:block;width:100%;margin:10px 0;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);color:#c4b5fd;border-radius:12px;padding:11px;font:inherit;font-size:14px;cursor:pointer}
.tray{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));margin:14px -20px calc(-24px - env(safe-area-inset-bottom));padding:12px 20px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(26,36,51,.85),var(--surface) 30%);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}
.tray.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1)}@keyframes pop{40%{transform:scale(1.03)}}
.tr-l{flex:1;background:none;border:0;text-align:left;color:var(--text);cursor:pointer;font:inherit;padding:0}
.tr-l b{display:block;font-size:15px}.tr-l span{font-size:13px;color:var(--muted)}
.tv-r{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.tv-r.miss .tv-n{color:var(--amber)}
.tv-m{flex:none;width:58px;background:var(--surface2);border:0;border-radius:8px;padding:6px 0;color:var(--text);font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.tv-n{flex:1;min-width:0;font-size:14.5px;overflow:hidden;text-overflow:ellipsis}.tv-n small{display:block;font-size:12px;color:var(--faint)}
.tv-g{width:58px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font:inherit;font-size:14px;padding:6px;text-align:right}
.tv-r em{font-style:normal;font-size:12px;color:var(--faint);margin-left:-4px}
.tv-r b{width:46px;text-align:right;font-family:var(--cond);font-size:19px;font-weight:500}
.tv-x{background:none;border:0;color:var(--faint);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.tv-f{padding:6px 12px;font-size:13px}
.sm-t{width:100%;min-height:150px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font:inherit;font-size:15px;resize:vertical}
.mic.on{background:#f0798a;color:#fff;animation:pulse 1.4s infinite}@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(240,121,138,.15)}}
.ph-i{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin-top:12px;background:var(--bg)}

.tb{display:flex;align-items:center;gap:2px}
.gear.ask{color:#c4b5fd}
.as-log{display:flex;flex-direction:column;gap:10px;min-height:120px;padding:6px 0 4px}
.as-u{align-self:flex-end;max-width:85%;background:var(--glacier);color:#0c2a31;border-radius:16px 16px 4px 16px;padding:9px 13px;font-size:15px;white-space:pre-wrap}
.as-a{align-self:flex-start;max-width:92%;background:var(--surface2);border-radius:16px 16px 16px 4px;padding:10px 13px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.as-acts{margin-top:10px;display:grid;gap:8px;white-space:normal}
.as-act{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13.5px}

<body>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside>

<script>
"use strict";
/* ------------------------------------------------------------ storage */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clip=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ------------------------------------------------------------ vocabulary */
const BANDS=[[80,"Super","var(--s4)"],[60,"Normal","var(--s3)"],[50,"Low","var(--s2)"],[0,"Very low","var(--s1)"]];
const ADVICE={"Super":"Recovery is above your usual: a good day to go for it if you feel it.",
  "Normal":"Recovery is in your usual range: train as planned and stay tuned to how it feels.",
  "Low":"Recovery is below your usual: see how the legs respond.",
  "Very low":"Recovery is well below your usual: keep an eye on how you feel today."};
const bandOf=s=>BANDS.find(b=>s>=b[0]);
const FEEL={1:"Strong",2:"Good",3:"Normal",4:"Poor",5:"Weak"};
const Q={
  sleep:{title:"How rested did you wake up?",
    hint:"Judge how you felt getting out of bed, not how the night went. Your watch already tracks the night.",
    opts:[["Exhausted","drained, could barely get up."],["Tired","felt like you needed a lot more sleep."],
      ["So-so","groggy at first, fine once moving."],["Rested","woke up fresh, even after a broken night."],
      ["Recharged","woke easily, full of energy."]]},
  feel:{title:"How recovered does your body feel?",
    hint:"Think legs and energy as if you had to train right now.",
    opts:[["Wrecked","heavy, sore legs; a session would be a struggle."],["Fatigued","legs still carry the last sessions."],
      ["Normal","neither fresh nor tired."],["Fresh","light legs, ready for a solid session."],
      ["Primed","you could go hard right now."]]},
};

/* ------------------------------------------------------------ crypto */
const b64={dec:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),enc:u=>btoa(String.fromCharCode(...u))};
async function keyFor(pass,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function decryptEnv(env,pass){
  const key=await keyFor(pass,b64.dec(env.salt));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64.dec(env.iv)},key,b64.dec(env.ct))));
}
async function encryptObj(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFor(pass,salt),new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1,salt:b64.enc(salt),iv:b64.enc(iv),ct:b64.enc(ct)};
}

/* ------------------------------------------------------------ score adjust (mirrors readiness.py) */
function applyAnswers(day,ans){
  if(day.score==null) return day;
  let mod=0,sick=false;
  if(ans){ if(ans.feel) mod+=(ans.feel-3)*5; if(ans.sleep) mod+=(ans.sleep-3)*2.5; if(ans.sick){sick=true;mod-=10;} }
  mod=clip(mod,-15,15);
  let s=clip(day.base+mod,1,100); if(sick||day.alarm) s=Math.min(s,49); s=Math.round(s);
  const band=bandOf(s)[1];
  return {...day,score:s,mod:Math.round(mod),band,advice:ADVICE[band],answers:ans||null};
}

/* ------------------------------------------------------------ state */
let DATA=null,sel=0,draft={},prevScore=0;
// a refresh (pull down, or the browser's reload) brings you back to the same page, day and scroll position;
// closing and reopening the app starts from Today
const RELOAD=(()=>{try{return performance.getEntriesByType("navigation")[0]?.type==="reload";}catch(e){return false;}})();
let NAV0=null;if(RELOAD){try{NAV0=JSON.parse(sessionStorage.getItem("rd_nav")||"null");}catch(e){}}
function saveNav(){try{sessionStorage.setItem("rd_nav",JSON.stringify({t:TAB,s:ATH_SUB,f:foodSel,d:DATA?.days?.[sel]?.date,y:scrollY}));}catch(e){}}
addEventListener("pagehide",saveNav);document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden") saveNav();});
const todayISO=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Rome"});
const fmtDay=(iso,o)=>new Date(iso+"T12:00").toLocaleDateString("en-GB",o);
const hm=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`};
const sameAns=(a,b)=>JSON.stringify(a||{},Object.keys(a||{}).sort())===JSON.stringify(b||{},Object.keys(b||{}).sort());

// opens at once on the last copy kept on this phone, then swaps in the fresh data as soon as it arrives
async function cachedEnv(){try{const c=await caches.open("rd-data"),r=await c.match("data.enc");return r?await r.json():null;}catch(e){return null;}}
async function saveEnv(txt){try{const c=await caches.open("rd-data");await c.put("data.enc",new Response(txt,{headers:{"content-type":"application/json"}}));}catch(e){}}
function useData(d,quiet,keepY){
  const keepDate=quiet&&DATA?DATA.days[sel]?.date:null,keepDraft=quiet?{...draft}:null;
  DATA=d; CAL=null; ATH_CACHE=null;
  for(const d of DATA.days){const n=LS.get("note:"+d.date); if(n&&!d.note) d.note=JSON.parse(n);}
  for(const d of DATA.days){const l=LS.get("ans:"+d.date); if(l&&!d.answers) Object.assign(d,applyAnswers(d,JSON.parse(l)));}
  // always open on today, even before today's data has arrived
  const today=todayISO();
  if(!DATA.days.some(d=>d.date===today)){
    const loc=LS.get("ans:"+today);
    DATA.days.push({date:today,workouts:[],plan:(DATA.upcoming||{})[today]||[],answers:loc?JSON.parse(loc):null});
  }
  const k=keepDate?DATA.days.findIndex(d=>d.date===keepDate):NAV0?.d?DATA.days.findIndex(d=>d.date===NAV0.d):-1;
  sel=k>=0?k:DATA.days.findIndex(d=>d.date===today);
  draft=keepDraft&&Object.keys(keepDraft).length?keepDraft:{...(DATA.days[sel].answers||{})};
  loadedAt=Date.now(); if(!quiet) prevScore=0; render(); if(quiet) scrollTo(0,keepY);
  else if(NAV0&&!NAV0.used){NAV0.used=true;requestAnimationFrame(()=>scrollTo(0,NAV0.y||0));}
}
let swDone=false;
async function load(quiet=false){
  const pass=LS.get("rd_pass"); if(!pass) return lock();
  quiet=quiet&&!!DATA; let shown=quiet;
  if(!quiet){
    const c=await cachedEnv();
    if(c){ try{ useData(await decryptEnv(c,pass),false,0); shown=true; }catch(e){} }
    if(!shown) $("app").innerHTML=splash();
  }
  try{
    const r=await fetch("data.enc?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("No data published yet. Run the workflow on GitHub.");
    const txt=await r.text(),d=await decryptEnv(JSON.parse(txt),pass);
    saveEnv(txt);
    if(!shown||d.generated_at!==DATA.generated_at) useData(d,shown,scrollY); else loadedAt=Date.now();
  }catch(e){
    if(e.name==="OperationError") return lock("That passphrase doesn't match. Try again.");
    if(shown){ if(!quiet) toast("Offline · showing your last data"); return; }
    $("app").innerHTML=`<p class="loading">${esc(e.message)}</p>`; return;
  }
  flushOutbox();
  keepSubscription();
  if(!swDone&&"serviceWorker" in navigator){ swDone=true; navigator.serviceWorker.register("sw.js").catch(()=>{}); }
  autoRefresh();
}
let loadedAt=0,polling=false,autoTries=0;
// GitHub's schedule is unreliable (runs can be skipped for hours): every time the app opens
// with stale data, it asks GitHub to recalculate and waits for the new score by itself
// opening the app asks the server for a fresh calculation (the Keeper picks it up within ~20 s),
// then waits quietly for the new data; if today's score is still missing it says so
async function pingServer(){
  if(Date.now()-(+LS.get("rd_ping")||0)<120000) return;
  LS.set("rd_ping",String(Date.now()));
  try{ await fetch("https://ntfy.sh/"+await mailTopic(),{method:"POST",body:JSON.stringify({kind:"refresh"})}); }catch(e){}
}
async function autoRefresh(){
  const latest=DATA.days[DATA.days.length-1],age=Date.now()-new Date(DATA.generated_at).getTime();
  const stale=((latest.date!==todayISO()||latest.score==null)&&new Date().getHours()>=5)||age>30*60000;
  const synced=Date.now()-syncAt<10*60000;          // just back from Garmin Connect
  if((age<3*60000&&!synced)||polling||autoTries>=2) return;
  if(synced) LS.del("rd_ping");
  pingServer();
  autoTries++; polling=true; if(stale) setNote(synced?"Getting last night from Garmin…":"Checking for new data…");
  const was=DATA.generated_at,pass=LS.get("rd_pass"),t0=Date.now(),limit=(stale?11:6)*60000;
  while(Date.now()-t0<limit&&document.visibilityState==="visible"){
    await new Promise(r=>setTimeout(r,20000));
    try{
      const r=await fetch("data.enc?t="+Date.now(),{cache:"no-store"}); if(!r.ok) continue;
      const d=await decryptEnv(await r.json(),pass);
      if(d.generated_at!==was){ polling=false; return load(true); }
    }catch(e){}
  }
  polling=false; setNote("");
}
function setNote(t){ const n=$("upd-note"); if(n) n.textContent=t; const b=$("upd"); if(b) b.disabled=!!t; }
// the installed app stays in memory overnight: refresh the data when it comes back to the screen
// back after more than 10 minutes away: start again from today's score, like a fresh launch
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="hidden"){hiddenAt=Date.now();return;}
  if(DATA&&hiddenAt&&Date.now()-hiddenAt>10*60000&&!$("sheet").classList.contains("open")){
    TAB="today";ATH_SUB="profile";foodSel=todayISO();const i=DATA.days.findIndex(d=>d.date===todayISO());if(i>=0){sel=i;draft={...(DATA.days[i].answers||{})};}render();scrollTo(0,0);}
});
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"&&DATA&&!$("sheet").classList.contains("open")){ autoTries=0; if(Date.now()-loadedAt>60000) load(true); else autoRefresh(); }
});
async function requestUpdate(btn){
  autoTries=0; polling=false; LS.del("rd_ping"); autoRefresh();
}

const LOGO_C=[[255,93,108],[247,201,72],[52,211,153],[74,163,255]];
function logoSVG(sz){
  const P=a=>[50+38*Math.sin(a*Math.PI/180),50-38*Math.cos(a*Math.PI/180)];
  const arc=(a,b)=>{const[x1,y1]=P(a),[x2,y2]=P(b);return `M${x1.toFixed(2)} ${y1.toFixed(2)}A38 38 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;};
  const mix=t=>{t=Math.min(.9999,t)*3;const i=Math.floor(t),f=t-i,a=LOGO_C[i],b=LOGO_C[i+1];return `rgb(${a.map((v,k)=>Math.round(v+(b[k]-v)*f)).join(",")})`;};
  let segs="";for(let a=0;a<300;a+=3)segs+=`<path d="${arc(a,a+3.6)}" stroke="${mix(a/300)}" stroke-width="5" fill="none"/>`;
  const[hx,hy]=P(300);
  return `<svg viewBox="0 0 100 100" width="${sz}" height="${sz}" aria-hidden="true">
    <circle cx="50" cy="50" r="38" fill="none" stroke="#fff" stroke-opacity=".06" stroke-width="5"/>${segs}<circle cx="50" cy="12" r="2.5" fill="rgb(255,93,108)"/>
    <circle cx="${hx.toFixed(2)}" cy="${hy.toFixed(2)}" r="4.2" fill="#fff"/><circle cx="${hx.toFixed(2)}" cy="${hy.toFixed(2)}" r="1.6" fill="#121a26"/></svg>`;
}
function splash(){return `<div class="splash">${logoSVG(96)}<div class="sp-w">Readiness</div></div>`;}
function lock(msg){
  const tb=$("tabbar"); if(tb) tb.remove();
  $("app").innerHTML=`<div class="lock">${logoSVG(64)}<h1>Readiness</h1><p>Enter the passphrase you saved on GitHub. It stays on this device.</p>
    <div class="field"><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn" id="go">Unlock</button><div class="err">${esc(msg||"")}</div></div>`;
  const go=()=>{const v=$("pw").value.trim(); if(v){LS.set("rd_pass",v);load();}};
  $("go").onclick=go; $("pw").onkeydown=e=>{if(e.key==="Enter")go()};
}

/* ------------------------------------------------------------ gauge */
const SEGS=[[0,50,"var(--s1)","Very low"],[50,60,"var(--s2)","Low"],[60,80,"var(--s3)","Normal"],[80,100,"var(--s4)","Super"]];
const segColor=v=>SEGS.find(s=>v<s[1]||s[1]===100)[2];
const RING={c:120,r:98,w:12};RING.C=2*Math.PI*RING.r;
const HUE={"var(--s1)":["#ff8a95","#ff4d5e"],"var(--s2)":["#ffe08a","#f2b632"],"var(--s3)":["#7ef0c0","#1fbf86"],"var(--s4)":["#8cc8ff","#3b82f6"],"var(--faint)":["#5f6c80","#5f6c80"]};

function gaugeSVG(score,band,color){
  const {c,r,w}=RING,[h1,h2]=HUE[color]||HUE["var(--faint)"],v=score??0,[hx,hy]=ringHead(v);
  const notches=[50,60,80].map(t=>{const a=(-90+3.6*t)*Math.PI/180,p=k=>[c+k*Math.cos(a),c+k*Math.sin(a)],[x1,y1]=p(r-w/2-1),[x2,y2]=p(r+w/2+1);

  return `<svg viewBox="0 0 240 240" aria-label="Readiness ${score??"pending"} of 100, ${esc(band)}">
    <defs>

      <circle class="r-arc" cx="${c}" cy="${c}" r="${r}" fill="none" stroke="url(#rg)" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${ringDash(v)}"/>

function legendHTML(band){

}
function animateGauge(from,to){
  const num=$("g-num"),arcs=[...document.querySelectorAll(".gauge .r-arc")],head=$("r-head");
  if(!num) return;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,T=reduce?0:1200,t0=performance.now();
  const step=now=>{const k=T?clip((now-t0)/T,0,1):1,e=1-Math.pow(1-k,3),v=from+(to-from)*e,d=ringDash(v),[hx,hy]=ringHead(v);
    arcs.forEach(a=>a.setAttribute("stroke-dasharray",d)); head.setAttribute("cx",hx.toFixed(2)); head.setAttribute("cy",hy.toFixed(2));
    num.textContent=Math.round(v); if(k<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

/* ------------------------------------------------------------ score sheet */
let scorePick=null;
function scoreChart(n){

  if(s.filter(d=>d.score!=null).length<2) return "<p class='sh-desc'>Not enough data yet.</p>";
  const W=320,H=170,PL=4,PR=30,PT=8,PB=8,y=v=>PT+(100-v)/100*(H-PT-PB),x=i=>PL+(i+.5)*((W-PL-PR)/s.length);
  const pick=scorePick==null||scorePick>=s.length||s[scorePick].score==null?s.map(d=>d.score!=null).lastIndexOf(true):scorePick;
  const zones=SEGS.map(([a,b,c])=>`<rect x="${PL}" y="${y(b)}" width="${W-PL-PR}" height="${y(a)-y(b)}" fill="${c}" opacity=".07"/>
    <line x1="${PL}" x2="${W-PR+4}" y1="${y(a)}" y2="${y(a)}" stroke="var(--muted)" stroke-dasharray="3 4" opacity="${a?.35:0}"/>
    ${a?`<text class="rl" x="${W-PR+8}" y="${y(a)+4}">${a}</text>`:""}`).join("");
  const line=s.map((d,i)=>d.score!=null?`${x(i).toFixed(1)},${y(d.score).toFixed(1)}`:null).filter(Boolean).join(" ");
  const r=n>7?3.2:4.6;
  const dots=s.map((d,i)=>d.score==null?"":`<circle cx="${x(i)}" cy="${y(d.score)}" r="${i===pick?r+2:r}" fill="${i===pick?segColor(d.score):"var(--surface)"}" stroke="${segColor(d.score)}" stroke-width="2"/>`).join("");
  const hits=s.map((d,i)=>`<rect data-si="${i}" x="${x(i)-(W-PL-PR)/s.length/2}" y="0" width="${(W-PL-PR)/s.length}" height="${H}" fill="transparent" style="cursor:pointer"/>`).join("");
  const pk=s[pick];
  return `<div class="readout"><span>${fmtDay(pk.date,{weekday:"short",day:"numeric",month:"short"})}</span><b>${pk.score}</b><em style="color:${segColor(pk.score)}">${pk.band}</em></div>
    <div class="sh-chart"><svg viewBox="0 0 ${W} ${H}">${zones}
      <line x1="${x(pick)}" x2="${x(pick)}" y1="${PT}" y2="${H-PB}" stroke="var(--muted)" opacity=".5"/>
      <polyline points="${line}" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linejoin="round" opacity=".85"/>${dots}${hits}</svg>
    <div class="ax"><span>${fmtDay(s[0].date,{day:"numeric",month:"short"})}</span><span>${fmtDay(s[s.length-1].date,{day:"numeric",month:"short"})}</span></div></div>`;

/* ------------------------------------------------------------ signals */
const SIG={
  hrv:{name:"HRV",unit:"ms",fmt:v=>Math.round(v),weight:"40%",
    desc:"Heart rate variability overnight: the median of the watch's 5-minute readings across the night, which ignores restless moments. The score uses its 7-day trend against your last 60 days. Higher than your normal usually means good recovery; a drop that lasts several days points to fatigue, stress or illness.",
    status:c=>c.value<c.lo?[c.lo-c.value<1?"Just below normal":`${Math.round(c.lo-c.value)} ms below normal`,"var(--amber)"]:c.value>c.hi?[c.value-c.hi<1?"Just above normal":`${Math.round(c.value-c.hi)} ms above normal`,"var(--alpine)"]:["Within normal","var(--muted)"]},
  rhr:{name:"Sleeping HR",unit:"bpm",fmt:v=>Math.round(v),weight:"20%",
    desc:"Your lowest 30 minutes of heart rate during sleep, from the watch's all-night heart rate. A rise of 3–5 bpm over your normal often shows up with accumulated fatigue or a cold coming on.",
    status:c=>c.value>c.hi?[`${Math.max(1,Math.round(c.value-c.base))} bpm above average`,"var(--amber)"]:c.value<c.lo?["Below normal","var(--alpine)"]:["Within normal","var(--muted)"]},
  resp:{name:"Breathing rate",unit:"/min",fmt:v=>(Math.round(v*10)/10).toFixed(1),weight:"10%",
    desc:"Average breaths per minute during sleep. It is remarkably stable night to night, so a rise of one breath or more over your normal is one of the earliest signs of illness. It can only lower the score, never raise it.",
    status:c=>c.value>c.hi?[`${(c.value-c.base).toFixed(1)} above your normal`,"var(--amber)"]:["Within normal","var(--muted)"]},
  sleep:{name:"Sleep",unit:"h",fmt:v=>hm(v),weight:"15%",
    desc:"Time asleep last night against your own need. In the recovery score it counts through the Sleep score, which also weighs efficiency, deep and REM sleep, awakenings and how regular your timing is.",
    status:c=>c.value<c.lo?[`Below your minimum of ${hmh(c.lo)}`,"var(--amber)"]:c.value<c.hi?[`${hmh(c.hi-c.value)} under your usual`,"var(--muted)"]:["At or above your usual","var(--muted)"]},
  load:{name:"Training load",unit:"%",fmt:v=>(v>0?"+":"")+Math.round(v),weight:"15%",
    desc:"Form: fitness minus fatigue as a share of fitness, from yesterday's numbers. Between −10% and −30% you are training productively; below −30% fatigue is piling up.",
    status:c=>c.value< -30?["Heavy fatigue","var(--rose)"]:c.value< -10?["Productive training","var(--muted)"]:["Fresh","var(--alpine)"]},
};
function series(key,n){
  return DATA.days.slice(Math.max(0,sel-n+1),sel+1).map(d=>({date:d.date,c:d.comp?.[key]||null}));
}
function spark(key){
  const s=series(key,14),vals=s.filter(x=>x.c).map(x=>x.c.value);
  if(vals.length<2) return "";
  const last=s[s.length-1].c||{},lo=Math.min(...vals,last.lo??Infinity),hi=Math.max(...vals,last.hi??-Infinity);

/* streak: consecutive weeks with at least one activity (the current week keeps it alive until it ends) */
function streakInfo(){
  const weeks=new Set(Object.keys(DATA.volume||{}).map(mondayOf)),cur=mondayOf(todayISO());
  const step=(iso,k)=>{const d=new Date(iso+"T12:00");d.setDate(d.getDate()+7*k);return isoD(d);};
  let n=0,w=weeks.has(cur)?cur:step(cur,-1);
  while(weeks.has(w)){n++;w=step(w,-1);}
  const last=[...Array(12)].map((_,i)=>{const s=step(cur,i-11);return {start:s,on:weeks.has(s),cur:s===cur};});
  // best streak ever, for the restart messages
  const all=[...weeks].sort();let best=0,run=0,prev=null;
  for(const w0 of all){run=prev&&step(prev,1)===w0?run+1:1;best=Math.max(best,run);prev=w0;}
  return {n,thisWeek:weeks.has(cur),last,best};
}

function volCaption(P){return volMode==="week"?(P.short==="This"?"this week":P.title.replace("Week of","week of")):volMode==="month"?"in "+P.title:"in "+P.title.replace(" so far"," so far");}
function volumeSection(){

let fitPick=null;
function formZone(f){return f>5?["Fresh","var(--b3)"]:f>=-10?["Neutral","var(--muted)"]:f>=-30?["Optimal","var(--b5)"]:["High risk","var(--amber)"];}
function fitnessSection(){
  const s=DATA.days.filter(d=>d.ctl!=null).slice(-42); if(s.length<7) return "";
  const W=320,H=130,FH=46,PR=4,x=i=>(i+.5)*(W-PR)/s.length;
  const vals=s.flatMap(d=>[d.ctl,d.atl]),lo=Math.min(...vals)*.9,hi=Math.max(...vals)*1.05;
  const y=v=>6+(hi-v)/(hi-lo)*(H-12);
  const pl=k=>s.map((d,i)=>`${x(i).toFixed(1)},${y(d[k]).toFixed(1)}`).join(" ");
  const form=s.map(d=>(d.ctl-d.atl)/d.ctl*100),fmax=Math.max(40,...form.map(Math.abs));
  const fy=v=>FH/2-v/fmax*(FH/2-2);
  const fb=form.map((f,i)=>{const bw=(W-PR)/s.length*.62,[,c]=formZone(f);
    return `<rect x="${(x(i)-bw/2).toFixed(1)}" y="${Math.min(fy(f),FH/2).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,Math.abs(fy(f)-FH/2)).toFixed(1)}" rx="1" fill="${c}" opacity=".85"/>`;}).join("");
  const pick=fitPick==null||fitPick>=s.length?s.length-1:fitPick,pd=s[pick],pf=Math.round(form[pick]),[zn,zc]=formZone(form[pick]);
  const hits=s.map((d,i)=>`<rect data-fi="${i}" x="${(x(i)-(W-PR)/s.length/2).toFixed(1)}" y="0" width="${((W-PR)/s.length).toFixed(1)}" height="${H+FH+10}" fill="transparent" style="cursor:pointer"/>`).join("");
  return `<section class="sec" id="fitsec"><div class="sec-h"><h2>Fitness</h2><span>Last 6 weeks</span></div>
    <div class="card fit">
      <div class="fit-top">
        <div><span><i style="background:var(--b3)"></i>Fitness</span><b>${Math.round(pd.ctl)}</b></div>
        <div><span><i style="background:var(--pw)"></i>Fatigue</span><b>${Math.round(pd.atl)}</b></div>
        <div><span><i style="background:${zc}"></i>Form</span><b style="color:${zc}">${pf>0?"+":""}${pf}%</b></div>
      </div>
      <div class="fit-day">${fmtDay(pd.date,{weekday:"short",day:"numeric",month:"short"})} · ${zn}</div>
      <svg viewBox="0 0 ${W} ${H+FH+10}" class="fit-svg">
        <line x1="${x(pick)}" x2="${x(pick)}" y1="0" y2="${H+FH+10}" stroke="var(--muted)" opacity=".4"/>
        <polyline points="${pl("atl")}" fill="none" stroke="var(--pw)" stroke-width="1.6" stroke-linejoin="round" opacity=".9"/>
        <polyline points="${pl("ctl")}" fill="none" stroke="var(--b3)" stroke-width="2.4" stroke-linejoin="round"/>
        <circle cx="${x(pick)}" cy="${y(pd.ctl)}" r="4" fill="var(--b3)" stroke="var(--surface)" stroke-width="2"/>
        <circle cx="${x(pick)}" cy="${y(pd.atl)}" r="3.5" fill="var(--pw)" stroke="var(--surface)" stroke-width="2"/>
        <g transform="translate(0,${H+10})">
          <rect x="0" y="${fy(-10)}" width="${W-PR}" height="${fy(-30)-fy(-10)}" fill="var(--b5)" opacity=".07"/>
          <line x1="0" x2="${W-PR}" y1="${FH/2}" y2="${FH/2}" stroke="var(--line)"/>${fb}
        </g>${hits}
      </svg>
      <div class="ax"><span>${fmtDay(s[0].date,{day:"numeric",month:"short"})}</span><span>Form bars · shaded: optimal −10% to −30%</span><span>${fmtDay(s[s.length-1].date,{day:"numeric",month:"short"})}</span></div>
    </div></section>`;
}

/* ------------------------------------------------------------ steps & calories */
const EN_COL={basal:"#64748b",active_so_far:"#f59e0b",rest_of_day:"#fcd34d",planned:"#fb923c"};
const EN_TXT={basal:"Basal (resting, whole day)",active_so_far:"Active so far",rest_of_day:"Rest of the day, usual pace",planned:"Planned training still to do"};
const fmtK=n=>n==null?"–":Number(n).toLocaleString("en-GB");
const asofTxt=h=>`${String(Math.floor(h)).padStart(2,"0")}:${String(Math.round(h%1*60)).padStart(2,"0")}`;
const STRESS=[[25,"Rest","#60a5fa"],[50,"Low","#fbbf24"],[75,"Medium","#f59e0b"],[100,"High","#f97316"]];
const stressBand=v=>STRESS.find(b=>v<=b[0]);
const EN_KEYS={kcal:["Calories","#f59e0b","kcal"],steps:["Steps","#34d399","steps"],km:["Distance","#2dd4bf","km"],stress:["Stress","#f472b6","avg stress"]};
function yourDay(){
  const E=DATA.energy?.today; if(!E) return "";
  const p=E.parts,tot=E.projected||1,seg=k=>`<i style="width:${p[k]/tot*100}%;background:${EN_COL[k]}"></i>`;
  const sp=E.goal?Math.min(100,E.steps/E.goal*100):0,sb=E.stress!=null?stressBand(E.stress):null;
  return `<section class="sec"><div class="sec-h"><h2>Your day</h2><span>As of ${asofTxt(E.asof)}</span></div>
  <div class="day4">
    <button class="en-c" data-en="kcal"><small>CALORIES</small><b>${fmtK(E.kcal_now)}<u>kcal</u></b>
      <div class="en-bar">${["basal","active_so_far","rest_of_day","planned"].map(seg).join("")}</div>
      <span>${(()=>{const e=foodOn()?ftot(foodDay(todayISO())).kcal:0,t=e?targetOf(todayISO()):null;return e?`Eaten ${fmtK(Math.round(e))}${t?` · ${fmtK(Math.max(0,Math.round(t.kcal-e)))} left`:""}`:`On track for ~${fmtK(E.projected)}`;})()}</span></button>
    <button class="en-c" data-en="steps"><small>STEPS</small><b>${fmtK(E.steps)}</b>
      <div class="en-bar"><i style="width:${sp}%;background:#34d399"></i></div>
      <span>${E.goal?(E.steps>=E.goal?"Goal reached":`${fmtK(E.goal-E.steps)} to ${fmtK(E.goal)}`):`~${fmtK(E.steps_projected)} by tonight`}</span></button>
    <button class="en-c" data-en="km"><small>DISTANCE</small><b>${E.km!=null?E.km.toFixed(1):"–"}<u>km</u></b>
      <div class="en-bar"><i style="width:${E.km&&E.steps_projected?Math.min(100,E.steps/E.steps_projected*100):0}%;background:#2dd4bf"></i></div>
      <span>Estimate, on the safe side</span></button>
    <button class="en-c" data-en="stress"><small>STRESS</small><b>${E.stress??"–"}${sb?`<em style="color:${sb[2]}">${sb[1]}</em>`:""}</b>
      <div class="st-bar">${STRESS.map(b=>`<i class="${sb===b?"on":""}" style="background:${b[2]}"></i>`).join("")}</div>
      <span>${E.stress!=null?"Day average so far":"No data yet"}</span></button>
  </div></section>`;
}
let enPick=null,enKey="kcal";
function enBars(key,n){
  const h=(DATA.energy?.history||[]).slice(-n),W=320,H=120,bw=W/h.length,vals=h.map(d=>d[key]||0),max=Math.max(...vals,1);
  const pick=enPick==null||enPick>=h.length?h.length-1:enPick,col=EN_KEYS[key][1];
  const bars=h.map((d,i)=>{const v=d[key],hh=v?Math.max(3,v/max*H):2;
    return `<rect x="${(i*bw+1.2).toFixed(1)}" y="${(H-hh).toFixed(1)}" width="${(bw-2.4).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${v?col:"var(--line)"}" opacity="${i===pick?1:.4}"/>
      <rect data-ei="${i}" x="${(i*bw).toFixed(1)}" y="0" width="${bw.toFixed(1)}" height="${H}" fill="transparent" style="cursor:pointer"/>`;}).join("");
  const goal=key==="steps"&&h[pick].goal?`<line x1="0" x2="${W}" y1="${H-h[pick].goal/max*H}" y2="${H-h[pick].goal/max*H}" stroke="var(--muted)" stroke-dasharray="3 4" opacity="${h[pick].goal<=max?.6:0}"/>`:"";
  const pd=h[pick],det=key==="kcal"?(pd.active!=null?`${fmtK(pd.active)} active + ${fmtK(pd.resting)} basal`:""):key==="steps"?(pd.km!=null?pd.km.toFixed(1)+" km":""):key==="km"?(pd.steps?fmtK(pd.steps)+" steps":""):(pd.stress!=null?stressBand(pd.stress)[1]:"");
  return `<div class="readout"><span>${fmtDay(pd.date,{weekday:"short",day:"numeric",month:"short"})}</span><b>${key==="km"&&pd.km!=null?pd.km.toFixed(1):fmtK(pd[key])}</b><em style="color:${col}">${EN_KEYS[key][2]}</em><span style="margin-left:auto">${esc(det)}</span></div>
    <div class="sh-chart bars30"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${goal}${bars}</svg>
    <div class="ax"><span>${fmtDay(h[0].date,{day:"numeric",month:"short"})}</span><span>${fmtDay(h[h.length-1].date,{day:"numeric",month:"short"})}</span></div></div>`;
}
function openEnergy(n=7,keep=false){
  if(!keep) enPick=null;
  const E=DATA.energy?.today; if(!E) return;
  const y=$("sheet").scrollTop,p=E.parts;
  openSheet(`<div class="sh-top"><h2>Your day</h2>${X}</div>
    <div class="sh-big" style="color:#f59e0b">~${fmtK(E.projected)}<small>kcal by tonight</small></div>
    <p class="sh-desc">${fmtK(E.kcal_now)} kcal burned so far (data at ${asofTxt(E.asof)}). The projection adds your full-day basal burn, the rest of the day at your usual pace outside workouts${E.planned_names.length?` and ${esc(E.planned_names.join(", "))} at your usual cost for that sport`:""}. It updates every 10 minutes as the day goes.</p>
    <div class="en-bar" style="height:10px">${["basal","active_so_far","rest_of_day","planned"].map(k=>`<i style="width:${p[k]/(E.projected||1)*100}%;background:${EN_COL[k]}"></i>`).join("")}</div>
    <div class="en-parts">${["basal","active_so_far","rest_of_day","planned"].filter(k=>p[k]>0).map(k=>`<div><i style="background:${EN_COL[k]}"></i><span>${EN_TXT[k]}</span><b>${fmtK(p[k])}</b></div>`).join("")}</div>
    <div class="kv"><span>Steps</span><b>${fmtK(E.steps)}${E.goal?` / ${fmtK(E.goal)}`:""}</b><span>Steps by tonight, at your usual pace</span><b>~${fmtK(E.steps_projected)}</b>${E.km!=null?`<span>Distance (estimate)</span><b>${E.km.toFixed(1)} km</b>`:""}${E.km_garmin?`<span>Garmin's figure</span><b>${E.km_garmin} km</b>`:""}${E.stress!=null?`<span>Stress, day average</span><b>${E.stress} · ${stressBand(E.stress)[1]}</b>`:""}</div>
    <p class="sh-note">Distance: GPS distance of runs and walks you record, plus the other steps × ${E.stride} m, your walking step length${E.height_known?" from your height":" (add your height in Athlete for a better one)"} shortened a little, since steps around the house are shorter than a real stride. When Garmin's own figure is lower, the lower one is kept, so it errs on the short side.</p>
    <div class="range">${Object.entries(EN_KEYS).map(([k,v])=>`<button data-k="${k}" class="${enKey===k?"on":""}">${v[0]}</button>`).join("")}</div>
    <div class="range" style="margin-top:8px"><button data-n="7" class="${n===7?"on":""}">7 days</button><button data-n="30" class="${n===30?"on":""}">30 days</button></div>
    ${enBars(enKey,n)}`);
  if(keep) $("sheet").scrollTop=y;
  $("sheet").querySelectorAll(".range button[data-n]").forEach(b=>b.onclick=()=>openEnergy(+b.dataset.n,true));
  $("sheet").querySelectorAll(".range button[data-k]").forEach(b=>b.onclick=()=>{enKey=b.dataset.k;openEnergy(n,true);});
  $("sheet").querySelectorAll("rect[data-ei]").forEach(r=>r.onclick=()=>{enPick=+r.dataset.ei;openEnergy(n,true);});
}

const MEALS=[["b","Breakfast"],["l","Lunch"],["d","Dinner"],["s","Snacks"]];
const MEAL_NAME=Object.fromEntries(MEALS),MEAL_TAG={b:"B'fast",l:"Lunch",d:"Dinner",s:"Snack"};
const KCAL_KG=7700;
const MAC={p:["Protein","#f07a8c"],c:["Carbs","#6fd3e6"],f:["Fat","#d9c46a"]};
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r1=v=>Math.round(v*10)/10;
const isoAdd=(iso,k)=>{const d=new Date(iso+"T12:00");d.setDate(d.getDate()+k);return d.toLocaleDateString("sv-SE");};
let foodSel=null,balN=30,balPick=null;

/* ------------------------------------------------------------ food: diary storage */
// Each entry travels on its own (add, edit, delete as a tombstone) and the newest copy wins,
// so the phone and the server can't overwrite each other's changes.
function foodLocal(){return lsJSON("rd_food",{});}
function foodSave(item){
  const L=foodLocal(),lim=isoAdd(todayISO(),-21);
  (L[item.date]=L[item.date]||{})[item.id]=item;
  for(const d of Object.keys(L)) if(d<lim) delete L[d];
  LS.set("rd_food",JSON.stringify(L));
  sendQ("food",item);
}
function foodDay(date){
  const m={};
  for(const it of (DATA.nutrition?.food||{})[date]||[]) m[it.id]=it;
  for(const it of Object.values(foodLocal()[date]||{})) if(!m[it.id]||(it.ts||0)>=(m[it.id].ts||0)) m[it.id]=it;
  return Object.values(m).filter(x=>!x.del).sort((a,b)=>(a.at||a.ts)-(b.at||b.ts));
}
function foodDates(){return [...new Set([...Object.keys(DATA.nutrition?.food||{}),...Object.keys(foodLocal())])].sort();}
const ftot=items=>items.reduce((a,x)=>({kcal:a.kcal+(x.kcal||0),p:a.p+(x.p||0),c:a.c+(x.c||0),f:a.f+(x.f||0)}),{kcal:0,p:0,c:0,f:0});
function recents(){
  const m=new Map(),lim=isoAdd(todayISO(),-90);
  for(const d of foodDates()) if(d>=lim) for(const it of foodDay(d)){
    if(it.k100==null&&it.src!=="quick") continue;
    const k=norm(it.name)+"|"+norm(it.brand); const o=m.get(k)||{n:0};
    m.set(k,{n:o.n+1,last:Math.max(o.last||0,it.ts||0),it});
  }
  return [...m.values()].sort((a,b)=>(b.n*2+b.last/864e5/7)-(a.n*2+a.last/864e5/7)).map(x=>x.it);
}

/* ------------------------------------------------------------ food: goal, burn, target */
function goalGet(){
  const l=lsJSON("rd_goal",null),s=DATA.nutrition?.goal||null;
  const g=!s?l:!l?s:(l.ts||0)>=(s.ts||0)?l:s;
  return g&&g.target?g:null;
}
function weightNow(){ATH_CACHE=null;const w=athLast("weight");return w?w.v:null;}
function goalState(){
  const g=goalGet(),w=weightNow(); if(!g) return null;
  if(w==null) return {g,w:null,dir:0,adj:0};
  const gap=g.target-w,dir=Math.abs(gap)<0.3?0:Math.sign(gap);
  const adj=dir*g.pace*KCAL_KG/7,weeks=dir?Math.abs(gap)/g.pace:0;
  return {g,w,gap,dir,adj:Math.round(adj/10)*10,eta:dir?isoAdd(todayISO(),Math.round(weeks*7)):null};
}
// Garmin's burn adjusted to what your weight actually did: needs two weeks of logging and weigh-ins
let CAL=null;
function calib(){
  if(CAL) return CAL;
  const H=DATA.energy?.history||[],today=todayISO(),lim=isoAdd(today,-28),ws=(ATH_CACHE=null,athSeries("weight")).filter(p=>p.date>=lim);
  const days=H.filter(h=>h.date>=lim&&h.date<today&&h.kcal).map(h=>({b:h.kcal,e:ftot(foodDay(h.date)).kcal})).filter(x=>x.e>=1000);
  CAL={f:1,n:days.length,ok:false};
  if(days.length<14||ws.length<2) return CAL;
  const t=ws.map(p=>(+new Date(p.date)-+new Date(ws[0].date))/864e5); if(t[t.length-1]<14) return CAL;
  const mt=t.reduce((a,b)=>a+b)/t.length,mv=ws.reduce((a,p)=>a+p.v,0)/ws.length;
  const slope=t.reduce((a,x,i)=>a+(x-mt)*(ws[i].v-mv),0)/t.reduce((a,x)=>a+(x-mt)**2,0);
  const eat=days.reduce((a,x)=>a+x.e,0)/days.length,burn=days.reduce((a,x)=>a+x.b,0)/days.length;
  const real=eat-slope*KCAL_KG;
  CAL={f:clip(real/burn,.85,1.15),n:days.length,ok:true,real:Math.round(real),garmin:Math.round(burn)};
  return CAL;
}
function burnOf(date){
  const E=DATA.energy||{},H=E.history||[],f=calib().f;
  if(date===todayISO()){
    if(E.today?.projected) return {v:Math.round(E.today.projected*f),proj:true};
    const past=H.filter(h=>h.kcal&&h.date<date).slice(-14).map(h=>h.kcal).sort((a,b)=>a-b);
    return past.length?{v:Math.round(past[past.length>>1]*f),proj:true,usual:true}:null;
  }
  const h=H.find(x=>x.date===date); return h&&h.kcal?{v:Math.round(h.kcal*f),proj:false}:null;
}
function targetOf(date){
  const b=burnOf(date); if(!b) return null;
  const gs=goalState(),adj=gs?gs.adj:0,floor=Math.max(1200,DATA.energy?.bmr||0);
  const kcal=Math.round(Math.max(floor,b.v+adj)/10)*10,w=weightNow()||70;
  const p=Math.round(1.8*w),f=Math.round(kcal*.27/9),c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  return {kcal,burn:b,adj:kcal-b.v,p,c,f,floored:b.v+adj<floor};
}

let offCtl=null,offTimer=null;const offCache=new Map();
const stem=w=>w.length>4?w.slice(0,-1):w;
function scoreFood(q,f){
  const ws=norm(q).split(/[^a-z0-9]+/).filter(w=>w.length>1); if(!ws.length) return 0;
  const toks=(norm(f.name)+" "+norm(f.alias||"")+" "+norm(f.brand||"")).split(/[^a-z0-9]+/).filter(Boolean);
  let hit=0; for(const w of ws){const s=stem(w); if(toks.some(t=>t.startsWith(s)||(t.length>3&&s.startsWith(stem(t))))) hit++;}
  if(hit<ws.length) return hit/ws.length*.5;
  const n=norm(f.name);
  return 1+(n.startsWith(ws[0])?.5:0)+(norm(f.alias||"").startsWith(ws[0])?.3:0)-n.length/200;
}
function myFoods(){return libAll().filter(e=>e.kind==="recipe").map(recipeFood);}
function localSearch(q,n=14){
  return [...myFoods(),...FOOD_REF].map(f=>({f,s:scoreFood(q,f)})).filter(x=>x.s>=1).sort((a,b)=>b.s-a.s).slice(0,n).map(x=>x.f);
}
function bestMatch(q){
  const pool=[...myFoods(),...recents().map(itemFood),...FOOD_REF];
  let best=null,bs=0; for(const f of pool){const s=scoreFood(q,f); if(s>bs){bs=s;best=f;}}
  return bs>=1?best:null;
}
function offFood(p){
  const n=p.nutriments||{},k=n["energy-kcal_100g"]??(n["energy_100g"]!=null?n["energy_100g"]/4.184:null);
  const name=p.product_name_it||p.product_name||p.product_name_en; if(!name||k==null) return null;
  const brand=Array.isArray(p.brands)?p.brands[0]:String(p.brands||"").split(",")[0].trim();
  const sv=+p.serving_quantity;
  return {name:String(name).trim(),brand:brand||"",k:Math.round(k),p:r1(+n.proteins_100g||0),c:r1(+n.carbohydrates_100g||0),f:r1(+n.fat_100g||0),
    serving:sv>0&&sv<2000?sv:null,src:"off",code:p.code||null};
}
const OFF_F="code,product_name,product_name_it,product_name_en,brands,nutriments,serving_quantity";
async function offSearch(q,signal){
  if(offCache.has(q)) return offCache.get(q);
  const t=(u,pick)=>fetch(u,{signal}).then(r=>{if(!r.ok) throw new Error(r.status);return r.json();}).then(j=>{const h=(pick(j)||[]).map(offFood).filter(Boolean);if(!h.length) throw new Error("empty");return h;});
  // both Open Food Facts search services at once: the first useful answer wins
  const res=await Promise.any([
    t(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(q)}&page_size=24&langs=it,en&fields=${OFF_F}`,j=>j.hits),
    t(`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(q)}&search_simple=1&action=process&json=1&page_size=24&lc=it&fields=${OFF_F}`,j=>j.products),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),12000))]).catch(e=>{if(signal.aborted) throw new DOMException("","AbortError");return [];});
  if(res.length) offCache.set(q,res);
  return res;
}
async function offBarcode(code){
  const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=${OFF_F}`);
  if(!r.ok) return null; const j=await r.json(); return j.status===1&&j.product?offFood({...j.product,code}):null;
}

/* ------------------------------------------------------------ food: paste a list, speak, photo */
const MEAL_RE=[["b",/(breakfast|colazione)/i],["l",/(lunch|pranzo)/i],["d",/(dinner|cena)/i],["s",/(snacks?|spuntin[oi]|merend[ae])/i]];
const mealOf=s=>{const m=MEAL_RE.find(([,re])=>re.test(s));return m?m[0]:null;};
const NUMW={"un'":1,un:1,uno:1,una:1,mezzo:.5,mezza:.5,due:2,tre:3,quattro:4,cinque:5,sei:6,sette:7,otto:8,a:1,an:1,one:1,two:2,three:3,four:4,half:.5};
let AND_PHRASES=null;
function protectAnd(s){   // keep dishes like "pasta e fagioli" or "cacio e pepe" in one piece
  if(!AND_PHRASES){AND_PHRASES=new Set();for(const f of FOOD_REF){const t=norm(f.name+" "+f.alias);for(const m of t.matchAll(/([a-z']+) e ([a-z']+)/g)) AND_PHRASES.add(m[0]);}}
  let t=s;for(const p of AND_PHRASES){const re=new RegExp("\\b"+p.replace(/'/g,"'")+"\\b","gi");t=t.replace(re,m=>m.replace(/ e /i," _e_ "));}
  return t;
}
function parseList(text,def){
  let meal=def||"b";const out=[];
  for(const raw of String(text).split(/\n+/)){
    let line=raw.replace(/\*\*|__/g,"").replace(/^[\s\-–—•*·>#]+/,"").trim(); if(!line) continue;
    const hm=line.match(/^([^:\d]{0,32}?)\s*(:|$)/);
    if(hm){const m=mealOf(hm[1]); if(m&&hm[1].trim().split(/\s+/).length<=4){meal=m;line=line.slice(hm[0].length).trim();if(!line) continue;}}
    const structured=/\d\s*kcal/i.test(line);
    const chunks=structured?[line]:protectAnd(line).split(/\s*(?:,|;|\+|\.\s|\be\b|\bed\b|\bpoi\b|\band\b|\bthen\b)\s*/i).map(c=>c.replace(/ _e_ /g," e ")).filter(c=>c.trim());
    for(let ch of chunks){
      const sm=ch.match(/\b(?:a|per|at|for)\s+(colazione|pranzo|cena|merenda|spuntino|breakfast|lunch|dinner|snack)\b/i);
      if(sm){meal=mealOf(sm[1]);ch=ch.replace(sm[0]," ");}
      ch=ch.replace(/\b(stamattina|stasera|oggi|ho mangiato|ho bevuto|ho preso|mangiato|bevuto|i had|i ate|i drank|circa|about|anche)\b/gi," ").trim();
      if(ch.replace(/[^a-zà-ú0-9]/gi,"").length<2) continue;
      out.push(...parseItem(ch,meal));
    }
  }
  return out;
}
function parseItem(s,meal){
  let t=" "+s+" ";const N="(\\d+(?:[.,]\\d+)?)";
  const grab=re=>{const m=t.match(re);if(!m) return null;t=t.replace(m[0]," ");return +m[1].replace(",",".");};
  const kcal=grab(new RegExp(N+"\\s*kcal","i"));
  const p=grab(new RegExp("\\b(?:p|prot|protein[ei]?|proteine)\\.?\\s*:?\\s*"+N+"\\s*g?(?![a-z])","i"));
  const c=grab(new RegExp("\\b(?:c|carb|carbs|carboidrati)\\.?\\s*:?\\s*"+N+"\\s*g?(?![a-z])","i"));
  const f=grab(new RegExp("\\b(?:f|fat|grassi)\\.?\\s*:?\\s*"+N+"\\s*g?(?![a-z])","i"));
  const g=grab(new RegExp(N+"\\s*(?:g|gr|grammi|grams?|ml)(?![a-z])","i"));
  let qty=null,unitSaid=false;const qm=t.match(/^\s*(\d+(?:[.,]\d+)?|un'|un|uno|una|mezzo|mezza|due|tre|quattro|cinque|sei|sette|otto|an?|one|two|three|four|half)\s+(?:di\s+|d'|of\s+)?/i);
  if(qm){qty=NUMW[qm[1].toLowerCase()]??+qm[1].replace(",",".");t=t.slice(qm[0].length);}
  // "2 fette di pane", "un bicchiere di latte", "1 slice bread": the unit word goes, the food's own unit is used
  const um=t.match(/^\s*(?:(?:fett[ae]|pezz[oi]|bicchier[ei]|tazz[ae]|tazzin[ae]|cucchiai(?:o|ni)?|cucchiain[oi]|porzion[ei]|piatt[oi]|vasett[oi]|scatolett[ae]|manciat[ae]|barrett[ae]|lattin[ae]|bottigli(?:a|e|etta))\s+(?:di\s+|d')|(?:slices?|glass(?:es)?|cups?|pieces?|bowls?|plates?|portions?|tablespoons?|teaspoons?|tbsp|tsp|cans?|handfuls?)\s+(?:of\s+)?)/i);
  if(um){t=t.slice(um[0].length);unitSaid=true;if(qty==null) qty=1;}
  const name=t.replace(/^\s*(?:di|d'|of)\s+/i,"").replace(/[|·•—–()\[\]]/g," ").replace(/\s[-:]\s/g," ").replace(/^[\s,.\-:]+|[\s,.\-:]+$/g,"").replace(/\s+/g," ").trim();
  if(!name) return [];
  const cap=x=>x[0].toUpperCase()+x.slice(1);
  if(kcal!=null) return [{meal,name:cap(name),brand:"",g:g?Math.round(g):null,kcal:Math.round(kcal),p:r1(p||0),c:r1(c||0),f:r1(f||0),
    k100:g?Math.round(kcal/g*100):null,p100:g&&p!=null?r1(p/g*100):null,c100:g&&c!=null?r1(c/g*100):null,f100:g&&f!=null?r1(f/g*100):null,src:"list",exact:true}];
