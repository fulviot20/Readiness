<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121a26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Readiness">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@300;400;500;600&display=swap" rel="stylesheet">
<title>Readiness</title>
<style>
:root{
  --bg:#121a26;--surface:#1a2433;--surface2:#212d3f;--line:#2a3749;
  --text:#eceff4;--muted:#8c98ab;--faint:#5f6c80;
  --rose:#e2687a;--amber:#e9a15a;--sand:#d9c46a;--alpine:#5fc795;--glacier:#6fd3e6;
  --z1:#7d8798;--z2:#3e8ede;--z3:#3fb97a;--z4:#e5c33f;--z5:#ee8a3a;--z6:#e04f5f;--z7:#9b6ce0;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --ui:"Barlow",-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--ui)}
body{padding:env(safe-area-inset-top) 18px calc(32px + env(safe-area-inset-bottom));
  background:radial-gradient(120% 60% at 50% -10%,#1d2a3d 0%,var(--bg) 60%) fixed}
main{max-width:520px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--glacier);outline-offset:2px;border-radius:8px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 4px}
.daypick{display:flex;align-items:center;gap:2px}
.daypick .d{font-family:var(--cond);font-size:24px;font-weight:500;letter-spacing:.01em;padding:0 4px}
.chev{background:none;border:0;width:34px;height:34px;display:grid;place-items:center;color:var(--muted);cursor:pointer;border-radius:10px}
.chev:disabled{opacity:.25;cursor:default}
.chev svg,.gear svg{width:20px;height:20px}
.gear{background:none;border:0;color:var(--muted);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:12px}

/* gauge */
.gauge{position:relative;margin:4px auto 0;max-width:340px}
.gauge svg{display:block;width:100%;height:auto;overflow:visible}
.g-num{font-family:var(--cond);font-weight:300;font-size:88px;letter-spacing:-.02em;fill:var(--text)}
.g-band{font-family:var(--cond);font-weight:500;font-size:20px;letter-spacing:.02em}
.g-tick{stroke:var(--faint)}
.g-lab{font-family:var(--cond);font-size:12px;fill:var(--faint)}
.adj{text-align:center;font-size:13px;color:var(--muted);min-height:18px;margin-top:6px}
.verdict{text-align:center;font-size:18px;font-weight:500;margin:14px 10px 4px;text-wrap:balance}
.why{text-align:center;font-size:14.5px;color:var(--muted);margin:0 16px;text-wrap:balance}
.notice{font-size:14px;color:var(--muted);text-align:center;margin:12px 0 0}

/* sections */
.sec{margin-top:30px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.sec-h h2{font-family:var(--cond);font-size:22px;font-weight:500;margin:0;letter-spacing:.01em}
.sec-h span{font-size:13px;color:var(--faint)}

/* signals */
.signals{border-top:1px solid var(--line)}
.sig{display:grid;grid-template-columns:1fr 92px 86px;align-items:center;gap:10px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;text-align:left;cursor:pointer}
.sig .n{font-weight:600;font-size:16px}
.sig .s{font-size:13.5px;color:var(--muted);margin-top:1px}
.sig .s i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.sig svg{width:92px;height:34px;display:block}
.sig .v{font-family:var(--cond);font-size:30px;font-weight:400;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.sig .v small{font-size:14px;color:var(--muted);margin-left:2px}

/* sessions */
.session{background:var(--surface);border-radius:18px;padding:16px 16px 14px;margin-bottom:10px}
.session .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.session .t b{font-weight:600}
.session .t span{color:var(--muted);font-size:14px;white-space:nowrap}
.session .k{font-size:13px;color:var(--faint);margin-bottom:4px}
.blocks{width:100%;height:58px;display:block;margin-top:12px}
.done{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.done span:last-child{color:var(--muted)}
.feelpip{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--text);font-size:13px;margin-left:6px}

/* check-in */
.checkin{background:var(--surface);border-radius:18px;padding:18px 16px}
.checkin .lead{font-size:14px;color:var(--muted);margin:0 0 18px}
.qq{margin-bottom:22px}
.qq h3{font-size:16px;font-weight:600;margin:0 0 10px}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg.two{grid-template-columns:1fr 1fr}
.seg button{background:var(--surface2);border:1px solid transparent;border-radius:12px;height:46px;cursor:pointer;
  font-family:var(--cond);font-size:22px;font-weight:500;color:var(--muted);transition:background .15s,color .15s}
.seg.two button{font-family:var(--ui);font-size:15px;font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
.anchor{min-height:42px;margin-top:9px;font-size:14px;color:var(--muted)}
.anchor b{color:var(--text);font-weight:600}
.savebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.savebar .st{font-size:13.5px;color:var(--muted)}
.btn{background:var(--glacier);color:#0c2a31;border:0;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:default}
.btn.quiet{background:var(--surface2);color:var(--text)}

/* trend */
.trend{background:var(--surface);border-radius:18px;padding:16px 14px 10px}
.trend svg{width:100%;height:118px;display:block}
.trend .ax{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:6px}

.foot{text-align:center;font-size:12.5px;color:var(--faint);margin-top:26px;line-height:1.6}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,9,15,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--surface);
  border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:11;max-width:560px;margin:0 auto}
.sheet:not(.open){visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 14px}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start}
.sh-top h2{font-family:var(--cond);font-size:28px;font-weight:500;margin:0}
.sh-top .x{background:var(--surface2);border:0;width:34px;height:34px;border-radius:50%;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.sh-big{font-family:var(--cond);font-size:56px;font-weight:300;line-height:1;margin:10px 0 2px}
.sh-big small{font-size:20px;color:var(--muted);margin-left:4px;font-weight:400}
.sh-desc{color:var(--muted);font-size:14.5px;margin:8px 0 16px}
.range{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;margin-bottom:12px}
.range button{background:none;border:0;padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted);cursor:pointer}
.range button.on{background:var(--bg);color:var(--text)}
.sh-chart svg{width:100%;height:170px;display:block}
.sh-chart .ax{display:flex;justify-content:space-between;font-size:12px;color:var(--faint);margin-top:4px}
.sh-chart .lg{font-size:12.5px;color:var(--faint);margin-top:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;margin-top:20px}
.stats div span{display:block;font-size:13px;color:var(--muted)}
.stats div b{font-family:var(--cond);font-size:24px;font-weight:500}
.field{margin-top:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font:inherit}
.field p{font-size:13px;color:var(--faint);margin:6px 0 0}

/* lock screen */
.lock{max-width:400px;margin:16vh auto 0}
.lock h1{font-family:var(--cond);font-weight:300;font-size:52px;margin:0}
.lock p{color:var(--muted);margin:4px 0 24px}
.lock .btn{width:100%;margin-top:22px;padding:14px}
.err{color:var(--rose);font-size:14px;margin-top:12px;min-height:20px}
.loading{margin-top:42vh;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside>

<script>
"use strict";
/* ------------------------------------------------------------ storage */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clip=(x,a,b)=>Math.max(a,Math.min(b,x));

/* ------------------------------------------------------------ vocabulary */
const BANDS=[[95,"Peak","var(--glacier)"],[75,"High","var(--alpine)"],[50,"Moderate","var(--sand)"],
  [25,"Low","var(--amber)"],[0,"Very low","var(--rose)"]];
const ADVICE={"Peak":"Ideal day for hard intervals or a test.","High":"Go ahead with the planned quality.",
  "Moderate":"Stick to the plan and listen to your legs in the hard parts.",
  "Low":"Swap quality for easy endurance.","Very low":"Rest or a very easy spin."};
const bandOf=s=>BANDS.find(b=>s>=b[0]);
const FEEL={1:"Strong",2:"Good",3:"Normal",4:"Poor",5:"Weak"};
const Q={
  sleep:{title:"How rested did you wake up?",
    hint:"Judge how you felt getting out of bed, not how the night went. Your watch already tracks the night.",
    opts:[["Exhausted","drained, could barely get up."],["Tired","felt like you needed a lot more sleep."],
      ["So-so","groggy at first, fine once moving."],["Rested","woke up fresh, even after a broken night."],
      ["Recharged","woke easily, full of energy."]]},
  feel:{title:"How recovered does your body feel?",
    hint:"Think legs and energy as if you had to train right now.",
    opts:[["Wrecked","heavy, sore legs; a session would be a struggle."],["Fatigued","legs still carry the last sessions."],
      ["Normal","neither fresh nor tired."],["Fresh","light legs, ready for a solid session."],
      ["Primed","you could go hard right now."]]},
};

/* ------------------------------------------------------------ crypto */
const b64={dec:s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0)),enc:u=>btoa(String.fromCharCode(...u))};
async function keyFor(pass,salt){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function decryptEnv(env,pass){
  const key=await keyFor(pass,b64.dec(env.salt));
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64.dec(env.iv)},key,b64.dec(env.ct))));
}
async function encryptObj(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFor(pass,salt),new TextEncoder().encode(JSON.stringify(obj))));
  return {v:1,salt:b64.enc(salt),iv:b64.enc(iv),ct:b64.enc(ct)};
}

/* ------------------------------------------------------------ score adjust (mirrors readiness.py) */
function applyAnswers(day,ans){
  if(day.score==null) return day;
  let mod=0,sick=false;
  if(ans){ if(ans.feel) mod+=(ans.feel-3)*5; if(ans.sleep) mod+=(ans.sleep-3)*2.5; if(ans.sick){sick=true;mod-=10;} }
  mod=clip(mod,-15,15);
  let s=clip(day.base+mod,1,100); if(sick||day.alarm) s=Math.min(s,49); s=Math.round(s);
  const band=bandOf(s)[1];
  return {...day,score:s,mod:Math.round(mod),band,advice:ADVICE[band],answers:ans||null};
}

/* ------------------------------------------------------------ state */
let DATA=null,sel=0,draft={},prevScore=0;
const todayISO=()=>new Date().toLocaleDateString("sv-SE",{timeZone:"Europe/Rome"});
const fmtDay=(iso,o)=>new Date(iso+"T12:00").toLocaleDateString("en-GB",o);
const hm=h=>{const m=Math.round(h*60);return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")}`};
const sameAns=(a,b)=>JSON.stringify(a||{},Object.keys(a||{}).sort())===JSON.stringify(b||{},Object.keys(b||{}).sort());

async function load(){
  const pass=LS.get("rd_pass"); if(!pass) return lock();
  $("app").innerHTML='<p class="loading">Loading your data…</p>';
  try{
    const r=await fetch("data.enc?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("No data published yet. Run the workflow on GitHub.");
    DATA=await decryptEnv(await r.json(),pass);
  }catch(e){
    if(e.name==="OperationError") return lock("That passphrase doesn't match. Try again.");
    $("app").innerHTML=`<p class="loading">${esc(e.message)}</p>`; return;
  }
  for(const d of DATA.days){const l=LS.get("ans:"+d.date); if(l&&!d.answers) Object.assign(d,applyAnswers(d,JSON.parse(l)));}
  const t=DATA.days.findIndex(d=>d.date===todayISO());
  sel=t>=0&&DATA.days[t].score!=null?t:DATA.days.map(d=>d.score!=null).lastIndexOf(true);
  draft={...(DATA.days[sel].answers||{})};
  prevScore=0; render();
}

function lock(msg){
  $("app").innerHTML=`<div class="lock"><h1>Readiness</h1><p>Enter the passphrase you saved on GitHub. It stays on this device.</p>
    <div class="field"><label for="pw">Passphrase</label><input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn" id="go">Unlock</button><div class="err">${esc(msg||"")}</div></div>`;
  const go=()=>{const v=$("pw").value.trim(); if(v){LS.set("rd_pass",v);load();}};
  $("go").onclick=go; $("pw").onkeydown=e=>{if(e.key==="Enter")go()};
}

/* ------------------------------------------------------------ gauge */
const CX=170,CY=150,R=124,A0=150,SWEEP=240;
const pol=(a,r)=>[CX+r*Math.cos(a*Math.PI/180),CY+r*Math.sin(a*Math.PI/180)];
const ang=v=>A0+SWEEP*clip(v,0,100)/100;
function arc(v1,v2,r){const[x1,y1]=pol(ang(v1),r),[x2,y2]=pol(ang(v2),r);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)}A${r} ${r} 0 ${ang(v2)-ang(v1)>180?1:0} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;}
function gaugeSVG(score,color,band){
  const segs=[[0,24.4,"var(--rose)"],[25.6,49.4,"var(--amber)"],[50.6,74.4,"var(--sand)"],[75.6,94.4,"var(--alpine)"],[95.6,100,"var(--glacier)"]];
  let ticks="";
  for(let v=0;v<=100;v+=2.5){const major=v%25===0,[x1,y1]=pol(ang(v),R-20),[x2,y2]=pol(ang(v),R-(major?32:25));
    ticks+=`<line class="g-tick" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke-width="${major?1.6:1}" opacity="${major?.9:.45}"/>`;
    if(major){const[lx,ly]=pol(ang(v),R-44);ticks+=`<text class="g-lab" x="${lx}" y="${ly+4}" text-anchor="middle">${v}</text>`;}}
  const [nx,ny]=pol(ang(score??0),R-10);
  return `<svg viewBox="0 0 340 262" aria-label="Readiness ${score??"pending"} of 100">
    <defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter></defs>
    ${segs.map(s=>`<path d="${arc(s[0],s[1],R)}" stroke="${s[2]}" stroke-width="4" fill="none" opacity=".28" stroke-linecap="round"/>`).join("")}
    <path id="g-fill-glow" d="${arc(0,Math.max(score??0,.5),R)}" stroke="${color}" stroke-width="8" fill="none" stroke-linecap="round" filter="url(#glow)" opacity=".55"/>
    <path id="g-fill" d="${arc(0,Math.max(score??0,.5),R)}" stroke="${color}" stroke-width="6" fill="none" stroke-linecap="round"/>
    ${ticks}
    <g id="g-needle" style="transform-origin:${CX}px ${CY}px">
      <line x1="${CX}" y1="${CY}" x2="${pol(ang(0),R-10)[0]}" y2="${pol(ang(0),R-10)[1]}" stroke="var(--text)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="${pol(ang(0),R)[0]}" cy="${pol(ang(0),R)[1]}" r="6" fill="var(--bg)" stroke="${color}" stroke-width="3"/>
    </g>
    <circle cx="${CX}" cy="${CY}" r="7" fill="var(--surface2)" stroke="var(--text)" stroke-width="2"/>
    <text class="g-num" id="g-num" x="${CX}" y="${CY+90}" text-anchor="middle">${score??"–"}</text>
    <text class="g-band" x="${CX}" y="${CY+112}" text-anchor="middle" fill="${color}">${esc(band)}</text>
  </svg>`;
}
function animateGauge(from,to){
  const needle=$("g-needle"),fill=$("g-fill"),glow=$("g-fill-glow"),num=$("g-num");
  if(!needle) return;
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches,T=reduce?0:1100,t0=performance.now();
  const step=now=>{const k=T?clip((now-t0)/T,0,1):1,e=1-Math.pow(1-k,3),v=from+(to-from)*e;
    needle.style.transform=`rotate(${SWEEP*v/100}deg)`;
    const d=arc(0,Math.max(v,.5),R); fill.setAttribute("d",d); glow.setAttribute("d",d);
    num.textContent=Math.round(v); if(k<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

/* ------------------------------------------------------------ signals */
const SIG={
  hrv:{name:"HRV",unit:"ms",fmt:v=>Math.round(v),weight:"40%",
    desc:"Heart rate variability measured overnight. Higher than your normal usually means good recovery; a drop that lasts several days points to fatigue, stress or illness.",
    status:c=>c.value<c.lo?[c.lo-c.value<1?"Just below normal":`${Math.round(c.lo-c.value)} ms below normal`,"var(--amber)"]:c.value>c.hi?[c.value-c.hi<1?"Just above normal":`${Math.round(c.value-c.hi)} ms above normal`,"var(--alpine)"]:["Within normal","var(--muted)"]},
  rhr:{name:"Resting HR",unit:"bpm",fmt:v=>Math.round(v),weight:"15%",
    desc:"Lowest heart rate overnight. A rise of 3–5 bpm over your normal often shows up with accumulated fatigue or a cold coming on.",
    status:c=>c.value>c.hi?[`${Math.max(1,Math.round(c.value-c.base))} bpm above average`,"var(--amber)"]:c.value<c.lo?["Below normal","var(--alpine)"]:["Within normal","var(--muted)"]},
  sleep:{name:"Sleep",unit:"h",fmt:v=>hm(v),weight:"20%",
    desc:"Time asleep last night and over the last three nights, against a 7-hour target. Nights under 4 h or over 11 h are treated as watch errors and ignored.",
    status:c=>c.value<7?[`${hm(7-c.value)} short of 7 h`,"var(--amber)"]:["On target","var(--muted)"]},
  load:{name:"Training load",unit:"%",fmt:v=>(v>0?"+":"")+Math.round(v),weight:"25%",
    desc:"Form: fitness minus fatigue as a share of fitness, from yesterday's numbers. Between −10% and −30% you are training productively; below −30% fatigue is piling up.",
    status:c=>c.value< -30?["Heavy fatigue","var(--rose)"]:c.value< -10?["Productive training","var(--muted)"]:["Fresh","var(--alpine)"]},
};
function series(key,n){
  return DATA.days.slice(Math.max(0,sel-n+1),sel+1).map(d=>({date:d.date,c:d.comp?.[key]||null}));
}
function spark(key){
  const s=series(key,14),vals=s.filter(x=>x.c).map(x=>x.c.value);
  if(vals.length<2) return "";
  const last=s[s.length-1].c||{},lo=Math.min(...vals,last.lo??Infinity),hi=Math.max(...vals,last.hi??-Infinity);
  const pad=(hi-lo)*.15||1,y=v=>34-((v-(lo-pad))/((hi+pad)-(lo-pad)))*34,x=i=>i*(92/(s.length-1));
  const pts=s.map((p,i)=>p.c?`${x(i).toFixed(1)},${y(p.c.value).toFixed(1)}`:null).filter(Boolean);
  const band=last.lo!=null?`<rect x="0" y="${y(last.hi)}" width="92" height="${Math.max(1,y(last.lo)-y(last.hi))}" fill="var(--text)" opacity=".06"/>`:"";
  const [lx,ly]=pts[pts.length-1].split(",");
  return `<svg viewBox="0 0 92 34" preserveAspectRatio="none" aria-hidden="true">${band}
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${lx}" cy="${ly}" r="2.6" fill="var(--text)"/></svg>`;
}
function signalRow(key,c){
  const m=SIG[key];
  if(!c) return `<button class="sig" disabled><div><div class="n">${m.name}</div><div class="s">No valid data</div></div><span></span><div class="v">–</div></button>`;
  const [st,col]=m.status(c);
  return `<button class="sig" data-sig="${key}"><div><div class="n">${m.name}</div><div class="s"><i style="background:${col}"></i>${esc(st)}</div></div>
    ${spark(key)}<div class="v">${m.fmt(c.value)}<small>${key==="sleep"?"":m.unit}</small></div></button>`;
}

/* ------------------------------------------------------------ workouts */
const zoneOf=p=>p<56?1:p<76?2:p<91?3:p<106?4:p<121?5:p<151?6:7;
function blocksSVG(steps){
  const tot=steps.reduce((a,s)=>a+s.min,0); if(!tot) return "";
  const W=320,H=58,gap=steps.length>40?.5:1.2; let x=0;
  const rects=steps.map(s=>{const mid=(s.lo+s.hi)/2,w=s.min/tot*W,h=clip(mid/135,.18,1)*H,z=zoneOf(mid);
    const r=`<rect x="${(x+gap/2).toFixed(2)}" y="${(H-h).toFixed(2)}" width="${Math.max(.6,w-gap).toFixed(2)}" height="${h.toFixed(2)}" rx="1.5" fill="var(--z${z})"/>`;
    x+=w; return r;}).join("");
  return `<svg class="blocks" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">${rects}</svg>`;
}
const dur=m=>m>=60?`${Math.floor(m/60)}h${m%60?String(Math.round(m%60)).padStart(2,"0"):""}`:`${Math.round(m)} min`;
function sessionCard(label,plan,done){
  const p=plan||{},d=done||[];
  return `<div class="session"><div class="k">${esc(label)}</div>
    <div class="t"><b>${esc(p.name||d[0]?.name||d[0]?.type||"Session")}</b><span>${p.minutes?dur(p.minutes):d[0]?.minutes?dur(d[0].minutes):""}</span></div>
    ${p.steps?.length?blocksSVG(p.steps):""}
    ${d.map(w=>`<div class="done"><span>Done · ${dur(w.minutes)}</span><span>${w.feel?`Felt <span class="feelpip">${FEEL[w.feel]||w.feel}</span>`:"No feel logged in Intervals"}</span></div>`).join("")}
  </div>`;
}
function sessions(day){
  const out=[]; const done=(day.workouts||[]).filter(w=>w.type);
  const plans=day.plan||[];
  if(plans.length) plans.forEach((p,i)=>out.push(sessionCard(day.date===todayISO()?"Today":fmtDay(day.date,{weekday:"long"}),p,i===0?done:[])));
  else if(done.length) out.push(sessionCard(day.date===todayISO()?"Today":fmtDay(day.date,{weekday:"long"}),null,done));
  if(day.date===todayISO()||sel===DATA.days.length-1){
    const tm=new Date(new Date(day.date+"T12:00").getTime()+864e5).toLocaleDateString("sv-SE");
    (DATA.upcoming?.[tm]||[]).forEach(p=>out.push(sessionCard("Tomorrow",p,[])));
  }
  return out.length?`<section class="sec"><div class="sec-h"><h2>Sessions</h2><span>Intervals plan</span></div>${out.join("")}</section>`:"";
}

/* ------------------------------------------------------------ check-in */
function checkin(raw){
  const scale=key=>{const q=Q[key],v=draft[key];
    return `<div class="qq"><h3>${q.title}</h3><div class="seg">${q.opts.map((o,i)=>
      `<button data-k="${key}" data-v="${i+1}" class="${v===i+1?"on":""}" aria-label="${i+1}: ${o[0]}">${i+1}</button>`).join("")}</div>
      <div class="anchor">${v?`<b>${q.opts[v-1][0]}</b>: ${q.opts[v-1][1]}`:esc(q.hint)}</div></div>`;};
  const saved=raw.answers&&sameAns(raw.answers,draft);
  const tok=!!LS.get("rd_token");
  return `<section class="sec"><div class="sec-h"><h2>Morning check-in</h2><span>Optional</span></div>
  <div class="checkin"><p class="lead">Answer within 30 minutes of waking, before coffee. It nudges the score by up to 15 points.</p>
    ${scale("sleep")}${scale("feel")}
    <div class="qq"><h3>Any signs of illness?</h3><div class="seg two">
      <button data-k="sick" data-v="0" class="${draft.sick===false?"on":""}">No</button>
      <button data-k="sick" data-v="1" class="${draft.sick===true?"on":""}">Yes</button></div>
      <div class="anchor">${draft.sick?"<b>Yes</b>: the score is capped at 49 until you feel well again.":"Sore throat, congestion, fever, unusual aches."}</div></div>
    <div class="savebar"><span class="st" id="qst">${saved?(tok?"Saved.":"Saved on this phone only."):""}</span>
      <button class="btn" id="qsave" ${saved||!Object.keys(draft).length?"disabled":""}>${raw.answers?"Update check-in":"Save check-in"}</button></div>
  </div></section>`;
}

/* ------------------------------------------------------------ trend */
function trend(){
  const days=DATA.days.slice(-30),W=300,H=104,bw=W/days.length;
  const y70=H-.7*H;
  const bars=days.map(d=>{const i=DATA.days.indexOf(d),s=d.score,h=s?Math.max(3,s/100*H):2,x=(days.indexOf(d))*bw;
    return `<rect data-i="${i}" x="${(x+1.2).toFixed(1)}" y="${(H-h).toFixed(1)}" width="${(bw-2.4).toFixed(1)}" height="${h.toFixed(1)}" rx="2"
      fill="${s?bandOf(s)[2]:"var(--line)"}" opacity="${i===sel?1:.42}" style="cursor:pointer"/>`;}).join("");
  const si=days.findIndex(d=>DATA.days.indexOf(d)===sel);
  return `<section class="sec"><div class="sec-h"><h2>Last 30 days</h2><span>Tap a day</span></div><div class="trend">
    <svg viewBox="0 0 ${W} ${H+8}" preserveAspectRatio="none">
      <line x1="0" x2="${W}" y1="${y70}" y2="${y70}" stroke="var(--muted)" stroke-dasharray="2 4" opacity=".5"/>${bars}
      ${si>=0?`<rect x="${(si*bw+1.2).toFixed(1)}" y="${H+4}" width="${(bw-2.4).toFixed(1)}" height="3" rx="1.5" fill="var(--text)"/>`:""}
    </svg><div class="ax"><span>${fmtDay(days[0].date,{day:"numeric",month:"short"})}</span><span>Dashed line: a typical day for you</span><span>${fmtDay(days[days.length-1].date,{day:"numeric",month:"short"})}</span></div></div></section>`;
}

/* ------------------------------------------------------------ main render */
function render(){
  const raw=DATA.days[sel],isToday=raw.date===todayISO();
  const day=isToday?applyAnswers(raw,Object.keys(draft).length?draft:raw.answers):raw;
  const has=day.score!=null,[,band,color]=has?bandOf(day.score):[0,"Waiting for data","var(--faint)"];
  const latest=DATA.days[DATA.days.length-1],todayPending=latest.date!==todayISO()||latest.score==null;
  const c=day.comp||{};
  const label=isToday?"Today":fmtDay(raw.date,{weekday:"short",day:"numeric",month:"short"});
  const chev=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;

  $("app").innerHTML=`
  <div class="top">
    <div class="daypick">
      <button class="chev" id="prev" aria-label="Previous day" ${sel<=0?"disabled":""}>${chev("M15 18l-6-6 6-6")}</button>
      <span class="d">${esc(label)}</span>
      <button class="chev" id="next" aria-label="Next day" ${sel>=DATA.days.length-1?"disabled":""}>${chev("M9 18l6-6-6-6")}</button>
    </div>
    <button class="gear" id="gear" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
  <div class="gauge">${gaugeSVG(has?day.score:null,color,band)}</div>
  <div class="adj">${has&&day.mod?`Signals ${day.base}, check-in ${day.mod>0?"+":""}${day.mod}`:""}</div>
  ${has?`<p class="verdict">${esc(day.advice)}</p><p class="why">${esc(day.why)}</p>`:""}
  ${todayPending&&sel===DATA.days.length-1?`<p class="notice">Today's score appears once your Garmin has synced to Intervals.</p>`:""}

  <section class="sec"><div class="sec-h"><h2>Signals</h2><span>Tap for history</span></div>
    <div class="signals">${["hrv","rhr","sleep","load"].map(k=>signalRow(k,c[k])).join("")}</div></section>

  ${isToday&&has?checkin(raw):""}
  ${sessions(raw)}
  ${trend()}
  <p class="foot">Updated ${esc(new Date(DATA.generated_at).toLocaleString("en-GB",{weekday:"long",hour:"2-digit",minute:"2-digit"}))}<br>Calibrated on ${DATA.calibration.n} days of your data</p>`;

  if(has){animateGauge(prevScore,day.score); prevScore=day.score;}
  bind(raw);
}

function bind(raw){
  $("prev").onclick=()=>go(sel-1); $("next").onclick=()=>go(sel+1);
  $("gear").onclick=openSettings;
  document.querySelectorAll(".sig[data-sig]").forEach(b=>b.onclick=()=>openSignal(b.dataset.sig));
  document.querySelectorAll(".trend rect[data-i]").forEach(r=>r.onclick=()=>go(+r.dataset.i));
  document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,v=+b.dataset.v;
    if(k==="sick") draft.sick=draft.sick===!!v?undefined:!!v; else draft[k]=draft[k]===v?undefined:v;
    Object.keys(draft).forEach(x=>draft[x]===undefined&&delete draft[x]);
    const y=scrollY; render(); scrollTo(0,y);
  });
  const s=$("qsave"); if(s) s.onclick=()=>saveAnswers(raw);
}
function go(i){ if(i<0||i>=DATA.days.length) return; sel=i; draft={...(DATA.days[sel].answers||{})}; render(); }

/* ------------------------------------------------------------ sheets */
function openSheet(html){ $("sheet").innerHTML=`<div class="grab"></div>${html}`; $("sheet").classList.add("open"); $("scrim").classList.add("open");
  const x=$("sheet").querySelector(".x"); if(x){x.onclick=closeSheet; x.focus();} }
function closeSheet(){ $("sheet").classList.remove("open"); $("scrim").classList.remove("open"); }
$("scrim").onclick=closeSheet; addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
const X=`<button class="x" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>`;

function sigChart(key,n){
  const s=series(key,n),pts=s.filter(p=>p.c); if(pts.length<2) return "<p class='sh-desc'>Not enough data yet.</p>";
  const W=320,H=150,last=pts[pts.length-1].c;
  const vals=pts.flatMap(p=>[p.c.value,p.c.lo??p.c.value,p.c.hi??p.c.value,p.c.avg7??p.c.value]);
  let lo=Math.min(...vals),hi=Math.max(...vals); const pad=(hi-lo)*.12||1; lo-=pad; hi+=pad;
  const y=v=>H-(v-lo)/(hi-lo)*H,x=i=>(i+.5)*(W/s.length),bw=Math.min(14,W/s.length*.55);
  const bandPath=()=>{const top=s.map((p,i)=>p.c?.hi!=null?`${x(i)},${y(p.c.hi)}`:null).filter(Boolean),
    bot=s.map((p,i)=>p.c?.lo!=null?`${x(i)},${y(p.c.lo)}`:null).filter(Boolean).reverse();
    return top.length>1?`<polygon points="${top.concat(bot).join(" ")}" fill="var(--alpine)" opacity=".10"/>`:"";};
  const marks=s.map((p,i)=>{if(!p.c) return ""; const v=p.c.value,inR=p.c.lo==null||(v>=p.c.lo&&v<=p.c.hi);
    const good=key==="rhr"?v<=p.c.hi:key==="load"?v>=-30:v>=p.c.lo;
    const col=inR?"var(--muted)":good?"var(--alpine)":"var(--amber)";
    return `<line x1="${x(i)}" x2="${x(i)}" y1="${H}" y2="${y(v)}" stroke="${col}" stroke-width="${bw}" stroke-linecap="round" opacity="${i===s.length-1?1:.7}"/>`;}).join("");
  const avg=key==="hrv"?`<polyline points="${s.map((p,i)=>p.c?`${x(i)},${y(p.c.avg7)}`:null).filter(Boolean).join(" ")}" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linejoin="round"/>`:"";
  return `<div class="sh-chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${bandPath()}${marks}${avg}</svg>
    <div class="ax"><span>${fmtDay(s[0].date,{day:"numeric",month:"short"})}</span><span>${fmtDay(s[s.length-1].date,{day:"numeric",month:"short"})}</span></div>
    <div class="lg">${key==="hrv"?"Bars are single nights, the line is the 7-day average, the shaded band is your normal range.":key==="sleep"?"The shaded band marks 7 to 9 hours.":key==="load"?"The shaded band is the productive range, −30% to −10%.":"The shaded band is your normal range."}</div></div>`;
}
function openSignal(key,n=7){
  const m=SIG[key],c=DATA.days[sel].comp[key];
  const stats={
    hrv:[["Last night",`${Math.round(c.value)} ms`],["7-day average",`${c.avg7} ms`],["Your normal",`${Math.round(c.lo)}–${Math.round(c.hi)} ms`],["Weight in score",m.weight]],
    rhr:[["Last night",`${c.value} bpm`],["Your average",`${c.base} bpm`],["Your normal",`${c.lo}–${c.hi} bpm`],["Weight in score",m.weight]],
    sleep:[["Last night",hm(c.value)],["3-night average",hm(c.avg3)],["Target","7:00 or more"],["Weight in score",m.weight]],
    load:[["Form",`${c.value>0?"+":""}${c.value}%`],["Fitness · fatigue",`${c.ctl} · ${c.atl}`],["Productive range","−30% to −10%"],["Weight in score",m.weight]],
  }[key];
  openSheet(`<div class="sh-top"><h2>${m.name}</h2>${X}</div>
    <div class="sh-big">${m.fmt(c.value)}<small>${key==="sleep"?"h":m.unit}</small></div>
    <p class="sh-desc">${m.desc}</p>
    <div class="range"><button data-n="7" class="${n===7?"on":""}">7 days</button><button data-n="30" class="${n===30?"on":""}">30 days</button></div>
    ${sigChart(key,n)}
    <div class="stats">${stats.map(s=>`<div><span>${s[0]}</span><b>${s[1]}</b></div>`).join("")}</div>`);
  $("sheet").querySelectorAll(".range button").forEach(b=>b.onclick=()=>openSignal(key,+b.dataset.n));
}
function openSettings(){
  openSheet(`<div class="sh-top"><h2>Settings</h2>${X}</div>
    <div class="field"><label for="s-pw">Passphrase</label><input id="s-pw" type="password" value="${esc(LS.get("rd_pass")||"")}"></div>
    <div class="field"><label for="s-tk">GitHub token</label><input id="s-tk" type="password" placeholder="Not set" value="${esc(LS.get("rd_token")||"")}">
      <p>Needed only to sync the check-in, so the server recalculates the score. Fine-grained token, access to this repository only, Contents: read and write.</p></div>
    <div class="savebar" style="margin-top:22px"><button class="btn quiet" id="s-out">Lock app</button><button class="btn" id="s-save">Save settings</button></div>`);
  $("s-save").onclick=()=>{const p=$("s-pw").value.trim(),t=$("s-tk").value.trim();
    if(p) LS.set("rd_pass",p); t?LS.set("rd_token",t):LS.del("rd_token"); closeSheet(); load();};
  $("s-out").onclick=()=>{LS.del("rd_pass"); closeSheet(); lock();};
}

/* ------------------------------------------------------------ save check-in */
async function saveAnswers(raw){
  const st=$("qst"),btn=$("qsave"); btn.disabled=true;
  LS.set("ans:"+raw.date,JSON.stringify(draft));
  Object.assign(raw,applyAnswers(raw,{...draft}));
  const token=LS.get("rd_token");
  const done=msg=>{const y=scrollY; render(); scrollTo(0,y); $("qst").textContent=msg;};
  if(!token) return done("Saved on this phone. Add a GitHub token in settings to sync.");
  st.textContent="Saving…";
  try{
    const owner=location.hostname.split(".")[0],repo=location.pathname.split("/").filter(Boolean)[0];
    const url=`https://api.github.com/repos/${owner}/${repo}/contents/answers/${raw.date}.json`;
    const hdr={Authorization:"Bearer "+token,Accept:"application/vnd.github+json"};
    let sha; const cur=await fetch(url,{headers:hdr}); if(cur.ok) sha=(await cur.json()).sha;
    const env=await encryptObj({date:raw.date,...draft},LS.get("rd_pass"));
    const r=await fetch(url,{method:"PUT",headers:{...hdr,"Content-Type":"application/json"},
      body:JSON.stringify({message:"Check-in "+raw.date,content:btoa(JSON.stringify(env)),...(sha?{sha}:{})})});
    if(!r.ok) throw new Error("GitHub "+r.status);
    done("Saved and synced. The server updates in a couple of minutes.");
  }catch(e){ done(`Saved on this phone only (${e.message}).`); }
}

load();
</script>
</body>
</html>
