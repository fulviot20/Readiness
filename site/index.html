<style>
/* opening screen: logo and name, shown at once (before the app's code loads) and faded out when the page is ready */
#boot{position:fixed;inset:0;z-index:50;background:#121a26;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:opacity .3s ease}
#boot img{width:156px;height:156px;margin-bottom:-14px;animation:boot-in .5s cubic-bezier(.2,.8,.2,1) both}
#boot b{font:300 40px/1 "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.03em;color:#eceff4;animation:boot-in .5s .08s cubic-bezier(.2,.8,.2,1) both}
#boot.out{opacity:0;pointer-events:none}
@keyframes boot-in{from{opacity:0;transform:translateY(6px) scale(.97)}}
@media (prefers-reduced-motion:reduce){#boot img,#boot b{animation:none}}
</style>
</head>
